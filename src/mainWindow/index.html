<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Clance</title>
    <link rel="stylesheet" href="../shared/theme.css" />
    <link rel="stylesheet" href="../shared/components.css" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--app-bg);
        color: var(--text-primary);
        font-family: var(--font-sans);
        font-weight: var(--weight-regular);
        -webkit-font-smoothing: antialiased;
      }
      code {
        font-family: var(--font-mono);
      }

      /* ---- Shell ---- */
      .shell {
        display: flex;
        height: 100vh;
        box-sizing: border-box;
      }
      /* Only the pane occupying the window's actual top-left corner gets
         this — its tab bar is the only one that ever sits under the
         traffic lights (titleBarStyle: hiddenInset). See topLeftLeafId
         in Shell.js. Compound selector so it can't lose to `.tab-bar`'s
         own `padding` shorthand on source order. */
      .tab-bar.tab-bar-inset {
        padding-left: 84px;
      }
      /* Lives inline at the trailing end of whichever tab bar sits in the
         window's top-right corner — normal flow content, not an overlay,
         so it never fights the tab bar's own drag region or gets covered
         by it. See topRightLeafId in Shell.js. Stays flush at the true
         trailing edge because .tab-list (not this) is the flex: 1 space-
         filler now — a spacer here too would just split the remaining
         space between the two instead of ceding all of it to the tabs. */
      .launcher-cluster {
        -webkit-app-region: no-drag;
        display: flex;
        align-items: center;
        gap: 2px;
        align-self: center;
        flex-shrink: 0;
        padding-right: var(--space-1);
      }
      .launcher-cluster .status-dot {
        margin: 0 var(--space-2);
      }
      .launcher-item {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 28px;
        height: 28px;
        flex-shrink: 0;
        background: transparent;
        border: none;
        border-radius: var(--radius-md);
        color: var(--text-secondary);
        cursor: pointer;
        transition: background-color 0.12s ease, color 0.12s ease;
      }
      .launcher-item:hover {
        background: var(--surface-hover);
        color: var(--text-primary);
      }
      .launcher-item-active {
        background: var(--app-bg);
        box-shadow: 0 0 0 1px var(--surface-border);
        color: var(--text-primary);
      }

      /* ---- Tab bar ---- */
      .shell-main {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
      }
      /* Tabs are cards standing on the bar's bottom line. The line is an
         inset shadow rather than a border so the active tab's paper paints
         over it and joins the page below. */
      .tab-bar {
        display: flex;
        align-items: flex-end;
        gap: 0;
        height: 40px;
        box-sizing: border-box;
        padding: var(--space-2) var(--space-2) 0;
        background: var(--surface-bg);
        box-shadow: inset 0 -1px 0 var(--surface-border);
        flex-shrink: 0;
        -webkit-app-region: drag;
      }
      /* The scrollable region for tabs, separate from .tab-bar itself —
         .tab-bar also carries the launcher-cluster (top-right corner
         buttons) as a sibling flex item. Without this wrapper, tabs and
         the launcher-cluster competed for the same row with no overflow
         boundary: past a certain tab count the whole row just grew wider
         than the window, dragging the corner buttons along with it instead
         of leaving them fixed in place. flex: 1 1 auto lets this absorb
         all the space the launcher-cluster doesn't need; min-width: 0
         overrides the flex-item default of min-width: auto, which would
         otherwise refuse to shrink below the tabs' natural total width and
         silently defeat overflow-x here. */
      .tab-list {
        display: flex;
        align-items: flex-end;
        gap: 2px;
        flex: 1 1 auto;
        min-width: 0;
        overflow-x: auto;
        overflow-y: hidden;
      }
      /* No scrollbar: a horizontal one takes its height out of the tabs,
         which pushes the labels up and lifts the active tab off the page
         below. The row still scrolls by trackpad or wheel, and the active
         tab is kept in view (PaneLeaf in Shell.js). */
      .tab-list::-webkit-scrollbar {
        display: none;
      }
      .tab {
        -webkit-app-region: no-drag;
        display: flex;
        align-items: center;
        gap: var(--space-2);
        max-width: 240px;
        height: 32px;
        box-sizing: border-box;
        flex-shrink: 0;
        padding: 0 10px 0 var(--space-3);
        border: 1px solid transparent;
        border-bottom: none;
        border-radius: var(--radius-md) var(--radius-md) 0 0;
        background: transparent;
        color: var(--text-secondary);
        font-size: var(--text-md);
        font-family: inherit;
        cursor: pointer;
      }
      .tab:hover {
        color: var(--text-primary);
      }
      .tab-active {
        background: var(--app-bg);
        border-color: var(--surface-border);
        color: var(--text-primary);
      }
      .tab-icon {
        display: flex;
        flex-shrink: 0;
      }
      .tab-label {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .tab-close {
        display: flex;
        visibility: hidden;
        flex-shrink: 0;
        margin-left: 2px;
        border-radius: 4px;
        padding: 2px;
      }
      .tab-close:hover {
        background: var(--surface-active);
      }
      .tab:hover .tab-close,
      .tab-active .tab-close {
        visibility: visible;
      }

      .content {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        padding: var(--space-6) var(--space-7) 64px;
        position: relative;
      }
      /* A pane filled by its own content: a terminal, a file viewer, the
         Changes sidecar. No page padding and no content column. */
      .content-flush {
        padding: 0;
        overflow: hidden;
        display: flex;
      }
      /* An open session: the terminal, then a one-line status bar. */
      .terminal-tab {
        display: flex;
        flex-direction: column;
        width: 100%;
        height: 100%;
        background: var(--app-bg);
      }
      .terminal-tab-body {
        flex: 1;
        min-height: 0;
        /* Less at the bottom: the terminal already leaves up to a row's
           height spare below its last line. */
        padding: var(--space-4) var(--space-5) var(--space-1);
        box-sizing: border-box;
      }
      .terminal-status {
        display: flex;
        align-items: center;
        gap: var(--space-4);
        height: 28px;
        flex-shrink: 0;
        padding: 0 var(--space-2) 0 var(--space-4);
        border-top: 1px solid var(--surface-border);
        font-family: var(--font-mono);
        font-size: var(--text-xs);
        color: var(--text-tertiary);
      }
      .terminal-status-hint {
        white-space: nowrap;
      }
      .terminal-status-spacer {
        flex: 1;
      }
      .terminal-status-action {
        height: 22px;
      }

      /* App-wide problem that blocks sessions, directly under the tab bar of
         the pane holding the launcher. */
      .app-banner {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: var(--space-3);
        height: 40px;
        flex-shrink: 0;
        background: var(--warning-bg);
        border-bottom: 1px solid var(--surface-border);
        font-size: var(--text-md);
        color: var(--text-primary);
      }

      /* ---- Panes ---- */
      .pane-area {
        position: relative;
        flex: 1;
        min-width: 0;
        min-height: 0;
        display: flex;
      }
      .pane-split {
        flex: 1;
        min-width: 0;
        min-height: 0;
        display: flex;
      }
      .pane-split-row {
        flex-direction: row;
      }
      .pane-split-column {
        flex-direction: column;
      }
      .pane-split-child {
        min-width: 0;
        min-height: 0;
        display: flex;
      }
      .pane-leaf {
        flex: 1;
        min-width: 0;
        min-height: 0;
        display: flex;
        flex-direction: column;
      }
      .pane-divider {
        flex-shrink: 0;
        background: var(--surface-border);
        transition: background-color 0.12s ease;
      }
      .pane-divider-row {
        width: 5px;
        cursor: col-resize;
      }
      .pane-divider-column {
        height: 5px;
        cursor: row-resize;
      }
      .pane-divider:hover {
        background: var(--accent);
      }
      /* Inner: split just the hovered pane. Scoped to that pane's own
         content box, so these only ever coincide with the outer/whole-
         layout zones below along a pane that happens to sit at the true
         window edge — deliberately thinner than the outer zones so a
         window-edge pane is still reachable for a purely local split. */
      .pane-drop-edges {
        position: absolute;
        inset: 0;
        z-index: 5;
      }
      .pane-drop-edge {
        position: absolute;
        background: transparent;
        transition: background-color 0.12s ease;
      }
      .pane-drop-edge:hover {
        background: var(--signal-soft);
      }
      .pane-drop-edge-left {
        left: 0;
        top: 0;
        bottom: 0;
        width: 18%;
      }
      .pane-drop-edge-right {
        right: 0;
        top: 0;
        bottom: 0;
        width: 18%;
      }
      .pane-drop-edge-top {
        top: 0;
        left: 0;
        right: 0;
        height: 18%;
      }
      .pane-drop-edge-bottom {
        bottom: 0;
        left: 0;
        right: 0;
        height: 18%;
      }

      /* Outer: split the whole layout — spans every pane already inside
         it (a bar under two side-by-side panes, a third pane extending a
         row, etc.), not just the one under the cursor. Sits along the
         true edge of the pane area, above the inner zones (z-index) but
         only within its own thin strip, so it never blocks reaching an
         inner zone further in. */
      .pane-drop-edges-outer {
        position: absolute;
        inset: 0;
        z-index: 10;
        pointer-events: none;
      }
      .pane-drop-edge-outer {
        position: absolute;
        pointer-events: auto;
        background: transparent;
        border: 2px dashed transparent;
        box-sizing: border-box;
        transition: background-color 0.12s ease, border-color 0.12s ease;
      }
      .pane-drop-edge-outer:hover {
        background: var(--signal-soft);
        border-color: var(--accent);
      }
      .pane-drop-edge-outer-left {
        left: 0;
        top: 0;
        bottom: 0;
        width: 10%;
      }
      .pane-drop-edge-outer-right {
        right: 0;
        top: 0;
        bottom: 0;
        width: 10%;
      }
      .pane-drop-edge-outer-top {
        top: 0;
        left: 0;
        right: 0;
        height: 10%;
      }
      .pane-drop-edge-outer-bottom {
        bottom: 0;
        left: 0;
        right: 0;
        height: 10%;
      }

      .pane-preview {
        position: absolute;
        z-index: 20;
        pointer-events: none;
        background: var(--signal-soft);
        border: 2px solid var(--accent);
        border-radius: var(--radius-sm);
        box-sizing: border-box;
        transition: left 0.08s ease, top 0.08s ease, width 0.08s ease, height 0.08s ease;
      }

      .tab-drop-before {
        box-shadow: -2px 0 0 var(--accent) inset;
      }

      /* Follows the cursor during a pointer-based tab drag (see Shell.js —
         appended straight to document.body, outside the Preact tree, and
         positioned via transform on every pointermove; never goes through
         Preact state). */
      .tab-drag-ghost {
        position: fixed;
        top: 0;
        left: 0;
        z-index: 9999;
        pointer-events: none;
        background: var(--surface-elevated);
        border: 1px solid var(--accent);
        border-radius: var(--radius-sm);
        padding: 6px 12px;
        font-size: var(--text-sm);
        font-family: var(--font-sans);
        color: var(--text-primary);
        box-shadow: var(--shadow-menu);
        white-space: nowrap;
      }

      /* ---- Page header ---- */
      /* ---- Page layout ---- */
      .section-page {
        max-width: 880px;
        margin: 0 auto;
      }
      /* Titled pages (Dictation, Tools, Settings) sit a little lower than the
         content padding alone would put them. Sessions has no title, so its
         search row gets the same offset. */
      .page-header {
        display: flex;
        align-items: baseline;
        gap: 14px;
        margin-top: var(--space-5);
        margin-bottom: var(--space-5);
      }
      .page-title {
        margin: 0;
        font-size: var(--text-xl);
        font-weight: var(--weight-semibold);
        letter-spacing: -0.03em;
        color: var(--text-primary);
      }
      .page-meta {
        font-family: var(--font-mono);
        font-size: var(--text-sm);
        color: var(--text-tertiary);
      }
      .page-subtitle {
        margin: calc(-1 * var(--space-3)) 0 var(--space-5);
        font-size: var(--text-md);
        line-height: 1.5;
        color: var(--text-secondary);
      }
      .search-row {
        display: flex;
        align-items: center;
        gap: var(--space-2);
        margin-bottom: var(--space-5);
      }
      .sessions-page .search-row {
        margin-top: var(--space-5);
      }

      .page-header-aside {
        margin-left: auto;
        display: inline-flex;
        align-items: center;
        gap: var(--space-1);
        font-size: var(--text-md);
        color: var(--text-secondary);
      }

      /* ---- Notice: an inline banner for something that needs attention ---- */
      .notice {
        display: flex;
        align-items: center;
        gap: var(--space-3);
        padding: var(--space-3) var(--space-4);
        margin-bottom: var(--space-5);
        border-radius: var(--radius-lg);
        background: var(--surface-bg);
      }
      .notice-attention {
        background: var(--warning-bg);
      }
      .notice-body {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .notice-title {
        font-size: var(--text-md);
        font-weight: var(--weight-medium);
        color: var(--text-primary);
      }
      .notice-text {
        font-size: var(--text-sm);
        color: var(--text-secondary);
      }

      /* ---- Dictation history ---- */
      .transcript-list {
        display: flex;
        flex-direction: column;
        border-top: 1px solid var(--surface-border);
      }
      .transcript-row {
        display: flex;
        align-items: flex-start;
        gap: var(--space-4);
        padding: 14px var(--space-2);
        border-bottom: 1px solid var(--surface-border);
      }
      .transcript-row:hover {
        background: var(--surface-bg);
      }
      .transcript-body {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 5px;
      }
      /* Same sizes as the Sessions table: 13px text, 12px mono details. */
      .transcript-text {
        font-size: var(--text-md);
        line-height: 1.5;
        color: var(--text-primary);
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      .transcript-meta {
        font-family: var(--font-mono);
        font-size: var(--text-sm);
        color: var(--text-tertiary);
      }
      .transcript-actions {
        display: flex;
        gap: 2px;
        visibility: hidden;
      }
      .transcript-row:hover .transcript-actions,
      .transcript-row:focus-within .transcript-actions {
        visibility: visible;
      }
      .dictation-bulk {
        position: relative;
        margin-left: auto;
      }
      /* Both labels share one grid cell so the button is always as wide as
         the longer one: switching between "Delete all…" and "Delete
         matching…" mustn't resize the search field. */
      .dictation-bulk-label {
        display: inline-grid;
      }
      .dictation-bulk-label > span {
        grid-area: 1 / 1;
        justify-self: center;
      }
      .dictation-bulk-label-sizer {
        visibility: hidden;
      }
      .dictation-confirm {
        position: absolute;
        top: calc(100% + 6px);
        right: 0;
        z-index: 20;
      }
      .dictation-range {
        position: relative;
        align-self: center;
      }
      .dictation-range-menu {
        position: absolute;
        top: calc(100% + 6px);
        right: 0;
      }
      .dictation-custom-range {
        display: flex;
        align-items: center;
        gap: var(--space-2);
        padding: var(--space-1) 10px 10px;
      }
      .dictation-range-sep {
        font-family: var(--font-mono);
        font-size: var(--text-xs);
        color: var(--text-tertiary);
      }
      /* Native date inputs, flattened to the app's field style. Both get the
         same explicit width: Chromium's intrinsic width for a date input
         isn't stable between two otherwise identical fields. */
      .dictation-date {
        width: 104px;
        height: 30px;
        box-sizing: border-box;
        padding: 0 var(--space-2);
        font-family: var(--font-mono);
        font-size: var(--text-sm);
        color: var(--text-primary);
        background: var(--surface-card);
        border: 1px solid var(--surface-border);
        border-radius: var(--radius-md);
        cursor: text;
      }
      .dictation-date:focus {
        outline: none;
        border-color: var(--text-primary);
      }

      /* ---- Clance tools (in Settings) ---- */
      .clance-tools-detail {
        padding: var(--space-3) 0 var(--space-2);
      }
      .tool-server {
        display: flex;
        align-items: center;
        gap: var(--space-3);
        padding: 10px var(--space-3);
        margin-bottom: var(--space-4);
        border-radius: var(--radius-md);
        background: var(--surface-bg);
      }
      .tool-server-text {
        font-size: var(--text-md);
        color: var(--text-primary);
      }
      .tool-server-spacer {
        flex: 1;
      }
      .tool-list {
        display: flex;
        flex-direction: column;
        border-top: 1px solid var(--surface-border);
      }
      .tool-row {
        display: flex;
        align-items: center;
        gap: var(--space-4);
        min-height: 48px;
        padding: 10px var(--space-1);
        box-sizing: border-box;
        border-bottom: 1px solid var(--surface-border);
      }
      .tool-row-main {
        flex: 1;
        min-width: 0;
        display: flex;
        align-items: baseline;
        flex-wrap: wrap;
        column-gap: var(--space-4);
        row-gap: 2px;
      }
      .tool-row-name {
        flex: 0 0 150px;
        font-family: var(--font-mono);
        font-size: var(--text-md);
        color: var(--text-primary);
      }
      .tool-row-description {
        flex: 1;
        min-width: 200px;
        font-size: var(--text-md);
        color: var(--text-secondary);
      }
      .tool-row-detail {
        flex: 1;
        min-width: 0;
        font-family: var(--font-mono);
        font-size: var(--text-sm);
        color: var(--text-tertiary);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .tool-row-tag {
        width: 90px;
        flex-shrink: 0;
        font-family: var(--font-mono);
        font-size: var(--text-sm);
        color: var(--text-tertiary);
      }
      .tool-row-tag-attention {
        color: var(--warning);
      }
      .section-note {
        margin: var(--space-3) 0 0;
        font-size: var(--text-sm);
        line-height: 1.5;
        color: var(--text-tertiary);
      }
      .section-note code,
      .empty-note code {
        font-family: var(--font-mono);
        font-size: var(--text-xs);
        padding: 1px 5px;
        border-radius: var(--radius-sm);
        background: var(--surface-bg);
        color: var(--text-secondary);
      }

      /* ---- Sessions table ---- */
      /* Search doubles as a command menu: matching sessions, then folders to
         start a new session in. */
      .command-search {
        position: relative;
        flex: 1;
        min-width: 0;
      }
      .search-input-large {
        height: 44px;
        padding: 0 14px;
        box-shadow: var(--shadow-field);
      }
      .search-input-large input {
        font-size: var(--text-base);
      }
      .command-menu {
        position: absolute;
        top: calc(100% + 6px);
        left: 0;
        right: 0;
        max-height: 420px;
        overflow-y: auto;
      }
      .kbd-quiet {
        height: 20px;
        border: none;
        background: var(--surface-bg);
        color: var(--text-secondary);
        font-size: var(--text-xs);
      }
      .filter-menu-wrap {
        position: relative;
        flex-shrink: 0;
      }
      .filter-button {
        height: 32px;
      }
      .filter-menu {
        position: absolute;
        top: calc(100% + 6px);
        right: 0;
        width: 190px;
      }
      .mic-menu-wrap {
        position: relative;
        flex-shrink: 0;
      }
      .mic-menu-button-label {
        max-width: 220px;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .mic-menu {
        position: absolute;
        top: calc(100% + 6px);
        right: 0;
        width: 300px;
      }
      .mic-menu .menu-item-title {
        flex-shrink: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .menu-check {
        width: 12px;
        flex-shrink: 0;
        font-size: var(--text-sm);
      }
      .context-menu {
        position: fixed;
        width: 240px;
        z-index: 40;
      }
      .toast-floating {
        position: fixed;
        right: var(--space-5);
        bottom: var(--space-5);
        z-index: 40;
      }

      /* ---- Session peek (docs/design.md, "Peeking at a session") ---- */
      /* Modal over the table rather than beside it: a peek is a glance you
         dismiss, so nothing behind it needs to stay reachable. */
      .peek-backdrop {
        position: fixed;
        inset: 0;
        z-index: 50;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: var(--space-6);
        background: var(--scrim);
      }
      .peek-panel {
        display: flex;
        flex-direction: column;
        width: min(660px, 100%);
        /* Shorter than the window on a big screen: a peek should read as a
           panel in front of the table, not a sheet that replaces it. */
        max-height: min(100%, 720px);
        background: var(--surface-elevated);
        border-radius: var(--radius-xl);
        box-shadow: var(--shadow-window);
        outline: none;
        overflow: hidden;
      }
      .peek-header {
        display: flex;
        align-items: flex-start;
        gap: var(--space-3);
        padding: var(--space-4) var(--space-4) var(--space-3);
        border-bottom: 1px solid var(--surface-border);
      }
      .peek-header-text {
        display: flex;
        flex-direction: column;
        gap: 3px;
        min-width: 0;
        flex: 1;
      }
      .peek-title {
        font-size: var(--text-lg);
        font-weight: var(--weight-medium);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .peek-meta {
        font-family: var(--font-mono);
        font-size: var(--text-xs);
        color: var(--text-tertiary);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .peek-body {
        flex: 1;
        overflow-y: auto;
        outline: none;
        padding: var(--space-4) var(--space-5) var(--space-5);
        display: flex;
        flex-direction: column;
        /* Turns are the unit the eye counts here, so they get the widest
           gap in the panel; everything inside one is tighter than this. */
        gap: var(--space-5);
      }
      /* The body holds focus so the scroll keys reach it (see
         SessionPeek.js), which otherwise opts it into the shared focus ring
         — a ring meant for controls someone tabbed to, not for a region
         focused on open. It's a box-shadow, so `outline: none` above
         doesn't cover it, and with the panel clipping its sides it showed
         as a bar above and below the conversation. The lit panel is where
         focus is; nothing here is a control. */
      .peek-body:focus-visible {
        box-shadow: none;
      }
      .peek-loading {
        display: flex;
        flex-direction: column;
        gap: var(--space-3);
      }
      /* Speaker on its own line above the words, not a bubble: the reply is
         the content, and a column of labels is what makes a long peek
         skimmable. */
      .peek-turn {
        display: flex;
        flex-direction: column;
        gap: var(--space-2);
      }
      .peek-role {
        font-family: var(--font-mono);
        font-size: var(--text-xs);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--text-tertiary);
      }
      .peek-blocks {
        display: flex;
        flex-direction: column;
        gap: var(--space-3);
        min-width: 0;
      }
      .peek-text {
        font-size: var(--text-md);
        line-height: 1.6;
        overflow-wrap: anywhere;
      }
      /* The user's own words, shown as typed — their line breaks are the
         only formatting a prompt has. */
      .peek-text-plain {
        white-space: pre-wrap;
      }
      /* The person's own words sit on paper of their own — the one thing in
         a peek that wasn't written by the model. */
      .peek-turn-user .peek-text-plain {
        padding: var(--space-2) var(--space-3);
        background: var(--accent-soft);
        border-radius: var(--radius-lg);
      }
      /* A run of tool calls is one stretch of work, so it's drawn as a
         single indented cluster between the sentences around it — tight
         rows behind one rule, rather than lines spaced like prose. */
      .peek-tools {
        display: flex;
        flex-direction: column;
        gap: 1px;
        padding-left: var(--space-3);
        border-left: 1px solid var(--surface-border);
        min-width: 0;
      }
      .peek-tool {
        display: flex;
        align-items: baseline;
        gap: var(--space-2);
        font-family: var(--font-mono);
        font-size: var(--text-xs);
        line-height: 1.7;
        color: var(--text-tertiary);
        min-width: 0;
      }
      /* One column for the verbs: with the names aligned, a run of calls
         scans as "Read, Read, Edit" down the left edge. */
      .peek-tool-name {
        flex-shrink: 0;
        min-width: 4.5em;
        color: var(--text-secondary);
      }
      .peek-tool-target {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .peek-tool-failed .peek-tool-name {
        color: var(--danger);
      }
      /* Inside the cluster already, so it indents under its own call rather
         than carrying a second rule beside the one around them both. */
      .peek-tool-result {
        font-family: var(--font-mono);
        font-size: var(--text-xs);
        line-height: 1.5;
        color: var(--text-tertiary);
        opacity: 0.85;
        margin: 2px 0 var(--space-2) var(--space-3);
        overflow-wrap: anywhere;
      }
      /* A slash command the user ran: the CLI's expansion of it is machinery,
         so only the name they typed is worth showing. */
      .peek-command {
        align-self: flex-start;
        font-family: var(--font-mono);
        font-size: var(--text-xs);
        padding: 2px var(--space-2);
        border-radius: var(--radius-sm);
        background: var(--surface-bg);
        color: var(--text-secondary);
      }
      /* Above the turns, where the messages it stands for would have been. */
      .peek-truncated {
        margin: 0;
        font-size: var(--text-sm);
        color: var(--text-tertiary);
      }
      .peek-footer {
        display: flex;
        align-items: center;
        gap: var(--space-2);
        padding: var(--space-3) var(--space-4);
        border-top: 1px solid var(--surface-border);
      }
      .peek-footer .icon-button {
        color: var(--text-secondary);
      }
      .peek-footer-spacer {
        flex: 1;
      }

      /* Markdown inside a peek (see shared/markdown.js). Tight vertical
         rhythm — this is a preview, not a document. */
      .peek-md > :first-child {
        margin-top: 0;
      }
      .peek-md > :last-child {
        margin-bottom: 0;
      }
      .peek-md p {
        margin: 0 0 var(--space-2);
      }
      .peek-md h1,
      .peek-md h2,
      .peek-md h3 {
        margin: var(--space-3) 0 var(--space-2);
        font-size: var(--text-md);
        font-weight: var(--weight-semibold);
      }
      .peek-md ul,
      .peek-md ol {
        margin: 0 0 var(--space-2);
        padding-left: var(--space-5);
      }
      .peek-md li {
        margin-bottom: 2px;
      }
      .peek-md code {
        font-family: var(--font-mono);
        font-size: var(--text-sm);
        padding: 1px 4px;
        border-radius: var(--radius-sm);
        background: var(--surface-bg);
      }
      .peek-md .code-block {
        margin: 0 0 var(--space-2);
        border: 1px solid var(--surface-border);
        border-radius: var(--radius-md);
        overflow: hidden;
      }
      .peek-md .code-block-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: var(--space-2);
        padding: var(--space-1) var(--space-2);
        background: var(--surface-bg);
        font-family: var(--font-mono);
        font-size: var(--text-xs);
        color: var(--text-tertiary);
      }
      .peek-md .code-copy-btn {
        border: none;
        background: none;
        padding: 0;
        cursor: pointer;
        font-family: var(--font-mono);
        font-size: var(--text-xs);
        color: var(--text-tertiary);
      }
      .peek-md .code-copy-btn:hover {
        color: var(--text-primary);
      }
      .peek-md .code-block pre {
        margin: 0;
        padding: var(--space-2);
        overflow-x: auto;
      }
      .peek-md .code-block code {
        padding: 0;
        background: none;
        font-size: var(--text-sm);
        line-height: 1.5;
      }
      .peek-md .tok-comment {
        color: var(--text-tertiary);
      }
      .peek-md .tok-string {
        color: var(--success);
      }
      .peek-md .tok-keyword {
        color: var(--accent);
        font-weight: var(--weight-medium);
      }
      .peek-md .tok-number {
        color: var(--warning);
      }
      /* Above the table, not below it: with a long history nobody scrolls to
         the end. It stands in for column headers, which the table doesn't
         need: each column is plain from its content. */
      .keyboard-hints {
        display: flex;
        gap: 18px;
        margin: 0 0 var(--space-3);
        padding-left: var(--space-2);
        font-family: var(--font-mono);
        font-size: var(--text-xs);
        color: var(--text-tertiary);
      }
      .skeleton {
        display: block;
        height: 10px;
        max-width: 100%;
        border-radius: 5px;
        background: var(--surface-bg);
      }
      .skeleton-short {
        width: 40px;
        margin-left: auto;
      }
      .session-row-skeleton {
        cursor: default;
      }
      .session-row-skeleton:hover {
        background: none;
      }

      /* First run: nothing to list yet. */
      .empty-state {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        padding: 90px var(--space-5);
        border: 1px dashed var(--surface-border);
        border-radius: var(--radius-xl);
        text-align: center;
      }
      .empty-state-logo {
        color: var(--text-tertiary);
      }
      .empty-state-title {
        font-size: var(--text-lg);
        font-weight: var(--weight-medium);
        color: var(--text-primary);
      }
      .empty-state-text {
        max-width: 460px;
        font-size: var(--text-base);
        line-height: 1.7;
        color: var(--text-secondary);
      }
      .empty-state-actions {
        display: flex;
        gap: var(--space-2);
        margin-top: 6px;
      }
      .session-table {
        display: flex;
        flex-direction: column;
        border-top: 1px solid var(--surface-border);
      }
      .session-row {
        display: grid;
        /* One indicator column, not two: a pin and a status dot never need
           to be read in the same instant, and two columns left every
           ordinary row — closed, unpinned, which is most of them — with an
           empty gutter before its title. */
        grid-template-columns: 16px minmax(0, 1fr) 130px 84px 60px 60px;
        align-items: center;
        column-gap: var(--space-3);
        padding: 0 var(--space-2);
        border-bottom: 1px solid var(--surface-border);
      }
      .session-row {
        height: 42px;
        cursor: pointer;
        color: var(--text-primary);
      }
      .session-row:hover,
      .session-row-selected {
        background: var(--surface-bg);
      }
      .sessions-keyboard-nav .session-row:not(.session-row-selected):hover {
        background: transparent;
      }
      .session-row-selected .session-title {
        font-weight: var(--weight-medium);
      }
      /* Holds both the pin and the status dot, stacked, with exactly one of
         them showing: the dot at rest, the pin when the row is hovered or
         pinned. An unpinned, idle list therefore carries no pin ink at all,
         and the affordance appears where the hand already is. */
      .session-pin {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0;
        border: none;
        background: none;
        cursor: pointer;
        color: var(--text-tertiary);
      }
      .session-pin .status-dot {
        position: absolute;
      }
      .session-pin svg {
        visibility: hidden;
      }
      .session-row:hover .session-pin svg,
      .session-row:focus-within .session-pin svg,
      .session-pin-on svg {
        visibility: visible;
      }
      .session-row:hover .session-pin .status-dot,
      .session-row:focus-within .session-pin .status-dot,
      .session-pin-on .status-dot {
        visibility: hidden;
      }
      /* Arrow-key navigation shouldn't swap a resting row's dot for a pin
         just because the pointer happens to be lying over it. */
      .sessions-keyboard-nav .session-row:hover:not(:focus-within) .session-pin:not(.session-pin-on) svg {
        visibility: hidden;
      }
      .sessions-keyboard-nav .session-row:hover:not(:focus-within) .session-pin:not(.session-pin-on) .status-dot {
        visibility: visible;
      }
      /* Filled, so a pinned row reads as pinned rather than as one someone
         happens to be hovering. The fill is what says "set", so the colour
         can stay quieter than the title beside it — except on a live row,
         where the pin inherits the dot's signal colour and goes on doing
         the dot's job. */
      .session-pin-on {
        color: var(--text-secondary);
      }
      .session-pin-on svg {
        fill: currentColor;
      }
      .session-pin-on.session-pin-tone-live {
        color: var(--signal);
      }
      .session-pin-on.session-pin-tone-attention {
        color: var(--warning);
      }
      .session-pin-on.session-pin-tone-danger {
        color: var(--danger);
      }
      .session-pin:hover {
        color: var(--text-primary);
      }
      /* Closes the pinned group. Heavier than the row borders on either side
         of it, and the only rule in the table that isn't one. */
      .session-row-pinned-last {
        border-bottom: 1px solid var(--divider-strong);
      }
      .session-dot-attention {
        background: var(--warning);
      }
      .session-dot-danger {
        background: var(--danger);
      }
      .session-title {
        font-size: var(--text-md);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .session-project,
      .session-updated {
        font-family: var(--font-mono);
        font-size: var(--text-sm);
        color: var(--text-secondary);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .session-updated {
        text-align: right;
      }
      .session-state {
        font-family: var(--font-mono);
        font-size: var(--text-sm);
        color: var(--text-tertiary);
        white-space: nowrap;
      }
      .session-state-live {
        color: var(--text-primary);
      }
      .session-state-attention {
        color: var(--warning);
      }
      .session-state-danger {
        color: var(--danger);
      }
      .session-state-ok {
        color: var(--success);
      }
      .session-actions {
        display: flex;
        justify-content: flex-end;
        gap: 2px;
      }
      .session-row-action {
        visibility: hidden;
      }
      .session-row:hover .session-row-action,
      .session-row:focus-within .session-row-action {
        visibility: visible;
      }
      .sessions-keyboard-nav .session-row:hover:not(:focus-within) .session-row-action {
        visibility: hidden;
      }
      .section-page > .segmented {
        margin-bottom: var(--space-5);
      }
      .search-row .search-input {
        flex: 1;
      }
      .empty-note {
        color: var(--text-secondary);
        font-size: var(--text-md);
      }
      .empty-note code {
        font-size: var(--text-xs);
        background: var(--surface-hover);
        border-radius: 4px;
        padding: 1px 5px;
      }

      /* ---- Search row (Chats) ---- */
      .new-session-wrap {
        position: relative;
      }

      /* ---- List groups / item cards ---- */
      /* ---- Lists shared by Settings and setup ---- */
      .list-group {
        display: flex;
        flex-direction: column;
        border-top: 1px solid var(--surface-border);
      }
      .list-group-label {
        font-family: var(--font-mono);
        font-size: var(--text-xs);
        color: var(--text-tertiary);
        margin-bottom: 6px;
      }

      /* A speech model row: name + tag, a note, a mono meta line, actions. */
      .item-card {
        display: flex;
        align-items: flex-start;
        gap: var(--space-3);
        padding: var(--space-3) var(--space-1);
        border-bottom: 1px solid var(--surface-border);
        color: var(--text-primary);
      }
      .item-card-icon {
        flex-shrink: 0;
        display: flex;
        margin-top: 1px;
        color: var(--text-tertiary);
      }
      .item-card-icon-accent {
        color: var(--text-primary);
      }
      .item-card-body {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 3px;
      }
      .item-card-title {
        display: flex;
        align-items: baseline;
        gap: var(--space-2);
        font-size: var(--text-md);
        font-weight: var(--weight-medium);
      }
      .item-card-description {
        font-size: var(--text-sm);
        line-height: 1.45;
        color: var(--text-secondary);
      }
      .item-card-meta {
        font-family: var(--font-mono);
        font-size: var(--text-xs);
        color: var(--text-tertiary);
      }
      .item-card-actions {
        flex-shrink: 0;
        display: flex;
        align-items: center;
        gap: var(--space-1);
      }
      .dictation-badge {
        font-family: var(--font-mono);
        font-size: var(--text-xs);
        font-weight: var(--weight-regular);
        color: var(--success);
      }
      .dictation-badge-muted {
        color: var(--text-tertiary);
      }
      .dictation-subsection {
        margin-top: var(--space-5);
      }
      .dictation-subsection:first-child {
        margin-top: 0;
      }
      .dictation-recommendation {
        margin: 0 0 var(--space-2);
      }

      /* Model download progress: a 500 MB download needs a real bar. */
      .install-bar {
        display: block;
        width: 100%;
        max-width: 260px;
        height: 4px;
        margin-top: 6px;
        background: var(--surface-border);
        border-radius: 2px;
        overflow: hidden;
      }
      .install-bar-fill {
        display: block;
        height: 100%;
        background: var(--accent);
        border-radius: 2px;
        transition: width 200ms linear;
      }
      /* Verifying and the Metal warm-up have no measurable progress, so the
         bar pulses at full width rather than sitting frozen at 100%. */
      .install-bar-fill-indeterminate {
        animation: install-pulse 1.4s ease-in-out infinite;
      }
      @keyframes install-pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.35; }
      }

      /* Hidden deliberately. The glyph is the only thing that opens
         Chromium's native calendar popover, and that popover is browser
         chrome — rendered outside the page and completely unstyleable.
         Removing the button means it can never open, while the field stays
         fully editable by typing or arrow keys. */
      .dictation-date::-webkit-calendar-picker-indicator {
        display: none;
      }
      .dictation-date::-webkit-datetime-edit,
      .dictation-date::-webkit-datetime-edit-fields-wrapper {
        padding: 0;
        background: transparent;
      }
      .dictation-date::-webkit-datetime-edit-text {
        color: var(--text-tertiary);
        padding: 0;
      }

      /* The transcription prompt is long-form text, so it gets a full-width
         block rather than the label-left/control-right row. */
      .dictation-prompt-row {
        padding: 14px 0;
        border-bottom: 1px solid var(--surface-border);
      }
      .dictation-prompt {
        width: 100%;
        box-sizing: border-box;
        margin-top: 10px;
        padding: 9px 11px;
        font-family: var(--font-mono);
        font-size: var(--text-sm);
        line-height: 1.55;
        color: var(--text-primary);
        background: var(--surface-card);
        border: 1px solid var(--surface-border);
        border-radius: var(--radius-lg);
        resize: vertical;
      }
      .dictation-prompt:focus {
        outline: none;
        border-color: var(--text-primary);
        box-shadow: 0 0 0 3px var(--accent-soft);
      }
      .dictation-prompt-actions {
        display: flex;
        align-items: center;
        gap: var(--space-3);
        margin-top: var(--space-2);
      }

      /* ---- Settings ----
         Same 880px page as the other tabs, so switching tabs doesn't move
         the edges. Descriptions stop at a readable width instead of running
         the full row. */
      .settings-pending {
        visibility: hidden;
      }
      .extension-group {
        margin-bottom: var(--space-6);
      }
      .group-title {
        margin: 0;
        padding-bottom: 6px;
        border-bottom: 1px solid var(--surface-border);
        font-family: var(--font-mono);
        font-size: var(--text-xs);
        font-weight: var(--weight-regular);
        color: var(--text-tertiary);
      }

      /* A status row: title and description on the left, a mono status word
         and an optional action on the right. */
      .status-card {
        display: flex;
        align-items: center;
        gap: var(--space-4);
        min-height: 56px;
        box-sizing: border-box;
        padding: 10px 0;
        border-bottom: 1px solid var(--surface-border);
      }
      .status-card-body {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 3px;
      }
      .status-card-title {
        font-size: var(--text-md);
        font-weight: var(--weight-medium);
        color: var(--text-primary);
      }
      .status-card-description {
        max-width: 560px;
        font-size: var(--text-sm);
        line-height: 1.45;
        color: var(--text-secondary);
      }
      .status-card-status {
        font-family: var(--font-mono);
        font-size: var(--text-sm);
        color: var(--text-tertiary);
        white-space: nowrap;
      }
      .status-card-status-ok {
        color: var(--success);
      }
      .status-card-status-attention {
        color: var(--warning);
      }

      .preference-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: var(--space-4);
        min-height: 56px;
        box-sizing: border-box;
        padding: 10px 0;
        border-bottom: 1px solid var(--surface-border);
      }
      .preference-title {
        font-size: var(--text-md);
        font-weight: var(--weight-medium);
        color: var(--text-primary);
      }
      .preference-description {
        max-width: 560px;
        margin-top: 3px;
        font-size: var(--text-sm);
        line-height: 1.45;
        color: var(--text-secondary);
      }
      .preference-description code {
        font-family: var(--font-mono);
        font-size: var(--text-xs);
      }
      .preference-row-actions {
        display: flex;
        align-items: center;
        gap: var(--space-3);
        flex-shrink: 0;
      }
      .preference-value {
        font-family: var(--font-mono);
        font-size: var(--text-sm);
        color: var(--text-secondary);
      }

      /* Shortcut recorder. The field is a button rather than a text input:
         the combination is captured from real keypresses, never typed. */
      .shortcut-field-wrap {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-shrink: 0;
      }
      .shortcut-field {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: var(--space-1);
        min-height: 30px;
        min-width: 86px;
        padding: 0 6px;
        background: transparent;
        border: 1px solid transparent;
        border-radius: var(--radius-md);
        font-family: inherit;
        cursor: pointer;
      }
      .shortcut-field:hover {
        border-color: var(--surface-border);
        background: var(--surface-card);
      }
      /* Recording must be obvious: the window is swallowing keystrokes and
         the app's global hotkeys are suspended while it waits. */
      .shortcut-field-recording,
      .shortcut-field-recording:hover {
        justify-content: center;
        min-width: 140px;
        background: var(--surface-card);
        border-color: var(--text-primary);
        box-shadow: 0 0 0 3px var(--accent-soft);
      }
      .shortcut-prompt {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        font-family: var(--font-mono);
        font-size: var(--text-sm);
        color: var(--text-primary);
      }
      .shortcut-prompt::before {
        content: "";
        width: 6px;
        height: 6px;
        border-radius: 3px;
        background: var(--signal);
        box-shadow: 0 0 0 3px var(--signal-soft);
      }
      .shortcut-hint {
        font-family: var(--font-mono);
        font-size: var(--text-xs);
        color: var(--text-tertiary);
        white-space: nowrap;
      }
      .shortcut-hint-ok {
        color: var(--success);
      }
      .shortcut-error {
        margin: 0 0 10px;
        text-align: right;
      }

      .settings-footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: var(--space-3);
        padding-top: 14px;
        border-top: 1px solid var(--surface-border);
        font-family: var(--font-mono);
        font-size: var(--text-sm);
        color: var(--text-secondary);
      }
      .settings-footer-brand {
        display: flex;
        align-items: center;
        gap: var(--space-2);
      }
      .settings-footer-brand .clance-logo {
        flex-shrink: 0;
        color: var(--text-secondary);
      }
      .update-check {
        display: flex;
        align-items: center;
        gap: var(--space-3);
      }
      .update-available {
        color: var(--text-primary);
      }
      .update-command {
        padding: 2px 6px;
        border-radius: var(--radius-sm);
        background: var(--surface-bg);
        color: var(--text-primary);
      }

      .dictation-model-list {
        margin: 0 0 var(--space-3);
      }
      /* Setup's single model card: id, tag, action, then download progress. */
      .model-card {
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding: var(--space-4);
        border: 1px solid var(--surface-border);
        border-radius: var(--radius-lg);
        background: var(--surface-card);
      }
      .model-card-head {
        display: flex;
        align-items: baseline;
        gap: 10px;
      }
      .model-card-name {
        font-size: var(--text-base);
        font-weight: var(--weight-medium);
        color: var(--text-primary);
      }
      .model-card-tag {
        font-family: var(--font-mono);
        font-size: var(--text-xs);
        color: var(--success);
      }
      .model-card-tag-ok {
        color: var(--text-tertiary);
      }
      .model-card-spacer {
        flex: 1;
      }
      .model-card-text {
        font-size: var(--text-md);
        line-height: 1.5;
        color: var(--text-secondary);
      }
      .model-card-progress {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .model-card-progress-row {
        display: flex;
        justify-content: space-between;
        font-family: var(--font-mono);
        font-size: var(--text-sm);
        color: var(--text-primary);
      }
      .model-card-progress-detail {
        color: var(--text-tertiary);
      }
      .model-menu-wrap {
        position: relative;
        margin: var(--space-3) 0;
      }
      .model-menu {
        position: absolute;
        top: calc(100% + 4px);
        left: 0;
        width: 340px;
      }
      .setup-more {
        padding-left: 0;
      }

      /* ---- Setup wizard ---- */
      .setup-wizard {
        display: flex;
        justify-content: center;
        min-height: 100vh;
        padding: 116px var(--space-6) var(--space-6);
        box-sizing: border-box;
      }
      .setup-frame {
        width: 480px;
        max-width: 100%;
        display: flex;
        flex-direction: column;
        gap: 30px;
      }
      .setup-progress {
        display: flex;
        align-items: center;
        gap: 14px;
        color: var(--text-primary);
      }
      .setup-progress .clance-logo {
        display: block;
        flex-shrink: 0;
      }
      .setup-progress-step {
        font-family: var(--font-mono);
        font-size: var(--text-sm);
        color: var(--text-tertiary);
      }
      .setup-progress-step-done {
        color: var(--text-secondary);
      }
      .setup-progress-step-current {
        color: var(--text-primary);
      }
      .setup-step {
        text-align: left;
      }
      .setup-step h2 {
        display: flex;
        align-items: baseline;
        gap: 10px;
        margin: 0 0 10px;
        font-size: var(--text-2xl);
        font-weight: var(--weight-semibold);
        line-height: 1.15;
        letter-spacing: -0.03em;
        color: var(--text-primary);
      }
      .setup-step > h2 + p {
        margin: 0 0 var(--space-6);
        font-size: var(--text-base);
        line-height: 1.6;
        color: var(--text-secondary);
      }
      .setup-step > .status-card:first-of-type,
      .setup-step > .preference-row:first-of-type {
        border-top: 1px solid var(--surface-border);
      }
      .setup-step-actions {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: var(--space-2);
        margin-top: var(--space-6);
      }
      .setup-step-actions-status {
        margin-right: auto;
      }
      .setup-optional {
        font-family: var(--font-mono);
        font-size: var(--text-sm);
        font-weight: var(--weight-regular);
        letter-spacing: 0;
        color: var(--text-tertiary);
      }
      /* A permission hint belongs to the row above it. */
      .setup-step .status-card:has(+ .setup-hint) {
        border-bottom: none;
        padding-bottom: 4px;
      }
      .setup-hint {
        margin: 0;
        padding: 0 0 14px;
        border-bottom: 1px solid var(--surface-border);
        font-size: var(--text-sm);
        line-height: 1.5;
        color: var(--text-secondary);
      }
      .setup-hint .btn-link {
        margin-left: var(--space-1);
      }
      .setup-hint-plain {
        padding: 10px 0 0;
        border-bottom: none;
      }
      .setup-error {
        margin: var(--space-2) 0 0;
        font-size: var(--text-sm);
        color: var(--danger);
      }
      .setup-command {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: var(--space-3) 14px;
        border-radius: 8px;
        background: var(--accent);
        font-family: var(--font-mono);
        font-size: var(--text-md);
        color: var(--accent-contrast);
      }
      .setup-command-text {
        flex: 1;
        min-width: 0;
        overflow-x: auto;
        white-space: nowrap;
      }
      .setup-command-prompt {
        color: var(--text-tertiary);
      }
      .setup-command .btn-small {
        background: transparent;
        border-color: var(--text-secondary);
        color: var(--accent-contrast);
      }
      .setup-waiting-icon {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 36px;
        height: 36px;
        flex-shrink: 0;
        border-radius: 8px;
        background: var(--surface-bg);
      }
      .setup-waiting {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: var(--space-4);
        border: 1px solid var(--surface-border);
        border-radius: var(--radius-lg);
        background: var(--surface-card);
      }

      input[type="checkbox"] {
        accent-color: var(--accent);
      }

      .loading {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        color: var(--text-secondary);
      }

      /* ---- Changes pane (see docs/design.md's "Changes pane") ----
         A monitor, sized for a narrow pane on the right: a bar saying where
         you are, a list of what is moving, and a commit box only when there
         is something to commit. Reading a file happens in a file tab. */
      /* Same reasoning as .file-section: a flex item of .content-flush has
         to be told it may be narrower than its content. */
      .changes-pane {
        display: flex;
        flex-direction: column;
        flex: 1;
        min-width: 0;
        height: 100%;
        min-height: 0;
      }
      .changes-bar {
        display: flex;
        align-items: center;
        gap: var(--space-2);
        flex-shrink: 0;
        padding: var(--space-2) var(--space-2) var(--space-2) var(--space-3);
      }
      .changes-repo {
        position: relative;
        flex: 1;
        min-width: 0;
      }
      .changes-repo-button {
        display: flex;
        align-items: center;
        gap: var(--space-2);
        max-width: 100%;
        padding: var(--space-1) var(--space-2);
        margin-left: calc(var(--space-2) * -1);
        background: transparent;
        border: none;
        border-radius: var(--radius-md);
        color: var(--text-primary);
        font-family: var(--font-sans);
        font-size: var(--text-md);
        cursor: pointer;
      }
      .changes-repo-button:hover {
        background: var(--surface-hover);
      }
      .changes-repo-name {
        font-weight: var(--weight-medium);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .changes-branch {
        flex-shrink: 0;
        font-family: var(--font-mono);
        font-size: var(--text-xs);
        color: var(--text-tertiary);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      /* Pinned to both edges of the repo button's box rather than sized by
         its contents: .menu's own min-width and the full paths inside pushed
         it past the pane's right edge, where it was clipped. The paths
         truncate instead (.menu-item-detail already ellipsises). */
      .changes-switcher {
        position: absolute;
        top: calc(100% + var(--space-1));
        left: 0;
        right: 0;
        z-index: 20;
        min-width: 0;
        max-width: none;
      }
      .changes-sync {
        display: flex;
        align-items: center;
        gap: 2px;
        flex-shrink: 0;
      }
      /* One line, dismissed by clicking it — a banner with its own button
         would be two controls for a message. */
      .changes-note {
        flex-shrink: 0;
        padding: var(--space-2) var(--space-3);
        background: var(--success-bg);
        font-size: var(--text-sm);
        cursor: pointer;
        overflow-wrap: anywhere;
      }
      .changes-note-warn {
        background: var(--warning-bg);
        color: var(--warning);
      }
      /* The one mono line in the pane: counts and state, not prose. */
      .changes-summary {
        display: flex;
        align-items: center;
        gap: var(--space-2);
        flex-shrink: 0;
        padding: 0 var(--space-2) var(--space-2) var(--space-3);
        font-family: var(--font-mono);
        font-size: var(--text-xs);
        color: var(--text-tertiary);
      }
      .changes-count {
        flex: 1;
        min-width: 0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .changes-totals {
        display: flex;
        gap: var(--space-2);
        flex-shrink: 0;
      }
      .changes-new-count {
        flex-shrink: 0;
        padding: 1px var(--space-2);
        border: none;
        border-radius: var(--radius-sm);
        background: var(--signal-soft);
        color: var(--signal);
        font-family: var(--font-mono);
        font-size: var(--text-xs);
        cursor: pointer;
      }
      /* Takes the height its rows need and no more, so the commit box sits
         under the list rather than at the bottom of the pane with a gap
         above it. It still shrinks and scrolls when the rows outgrow the
         pane, which keeps the commit box on screen. */
      .changes-list {
        flex: 0 1 auto;
        min-height: 0;
        overflow-y: auto;
        padding-bottom: var(--space-2);
      }
      .changes-clean,
      .changes-blank {
        margin: 0;
        padding: var(--space-4) var(--space-3);
        font-size: var(--text-md);
        color: var(--text-tertiary);
      }
      .changes-blank {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: var(--space-3);
      }
      .changes-blank p {
        margin: 0;
      }

      /* ---- a file row ---- */
      .change-item-open {
        background: var(--surface-bg);
      }
      .change-row {
        display: flex;
        align-items: center;
        gap: var(--space-2);
        min-height: 26px;
        padding: 0 var(--space-1) 0 var(--space-3);
        cursor: default;
      }
      .change-row:hover {
        background: var(--surface-hover);
      }
      /* A hairline box, not a filled one: staging is a side errand here and
         a column of solid ink was the loudest thing in the pane. It fills in
         only once it is actually on. */
      .change-check {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 13px;
        height: 13px;
        flex-shrink: 0;
        padding: 0;
        background: transparent;
        border: 1px solid var(--surface-border);
        border-radius: var(--radius-sm);
        color: var(--accent-contrast);
        cursor: pointer;
      }
      .change-row:hover .change-check {
        border-color: var(--divider-strong);
      }
      .change-check-on,
      .change-row:hover .change-check-on {
        background: var(--accent);
        border-color: var(--accent);
      }
      .change-status {
        width: 1ch;
        flex-shrink: 0;
        font-family: var(--font-mono);
        font-size: var(--text-xs);
        color: var(--text-tertiary);
      }
      .change-status-added,
      .change-status-untracked {
        color: var(--success);
      }
      .change-status-deleted {
        color: var(--danger);
      }
      .change-status-conflicted {
        color: var(--warning);
      }
      /* The name carries the weight and the directory recedes — a list of
         twenty paths from one project is read by its filenames. Truncation
         eats the front, because the end of a path is the part that names it. */
      .change-path {
        flex: 1;
        min-width: 0;
        font-family: var(--font-mono);
        font-size: var(--text-xs);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        direction: rtl;
        text-align: left;
      }
      .change-path > span {
        direction: ltr;
        unicode-bidi: embed;
      }
      .change-dir {
        color: var(--text-tertiary);
      }
      .change-name {
        color: var(--text-primary);
      }
      .change-new {
        width: 5px;
        height: 5px;
        flex-shrink: 0;
        border-radius: 50%;
        background: var(--signal);
      }
      .change-counts {
        display: flex;
        gap: var(--space-1);
        flex-shrink: 0;
        font-family: var(--font-mono);
        font-size: var(--text-xs);
      }
      .change-ins {
        color: var(--success);
      }
      .change-del {
        color: var(--danger);
      }
      .change-binary {
        color: var(--text-tertiary);
      }
      .change-expand {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 18px;
        height: 18px;
        flex-shrink: 0;
        padding: 0;
        background: transparent;
        border: none;
        border-radius: var(--radius-sm);
        color: var(--text-tertiary);
        cursor: pointer;
        transition: transform 0.12s ease;
      }
      .change-expand:hover {
        color: var(--text-primary);
      }
      .change-expand-on {
        transform: rotate(90deg);
        color: var(--text-primary);
      }
      .change-item-actions {
        display: flex;
        gap: var(--space-1);
        padding: 0 var(--space-2) var(--space-2) var(--space-3);
      }
      .change-item-actions .change-discard {
        color: var(--danger);
      }
      .change-confirm {
        display: flex;
        align-items: center;
        gap: var(--space-2);
        flex-wrap: wrap;
        padding: var(--space-2) var(--space-3);
        background: var(--warning-bg);
      }
      .change-confirm-text {
        flex: 1;
        min-width: 0;
        font-size: var(--text-sm);
        color: var(--warning);
        overflow-wrap: anywhere;
      }
      .change-row-confirming {
        background: var(--warning-bg);
      }

      /* ---- the inline peek ---- */
      .peek-diff {
        max-height: 220px;
        overflow: auto;
        padding: var(--space-1) 0;
        margin: 0 var(--space-2) 0 var(--space-3);
        border-left: 1px solid var(--surface-border);
        font-family: var(--font-mono);
        font-size: var(--text-xs);
        line-height: 1.5;
      }
      .peek-diff-empty {
        padding: var(--space-1) var(--space-3);
        color: var(--text-tertiary);
        font-family: var(--font-mono);
        font-size: var(--text-xs);
      }
      .peek-diff-line {
        display: flex;
        white-space: pre;
      }
      .peek-diff-mark {
        width: 2ch;
        flex-shrink: 0;
        text-align: center;
        user-select: none;
        color: var(--text-tertiary);
      }
      .peek-diff-text {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .peek-diff-add {
        background: var(--diff-add-bg);
      }
      .peek-diff-add .peek-diff-mark {
        color: var(--diff-add-mark);
      }
      .peek-diff-del {
        background: var(--diff-del-bg);
      }
      .peek-diff-del .peek-diff-mark {
        color: var(--diff-del-mark);
      }
      .peek-diff-hunk {
        color: var(--text-tertiary);
      }

      /* ---- the history strip ----
         What the pane shows when there is nothing to review, which is most of
         the time. It takes the space the file list doesn't want. */
      /* flex-basis 0, not auto: with a content-sized basis the number of
         commit rows fed back into the layout that decides how many rows fit,
         which is a ResizeObserver loop. Height comes from leftover space. */
      .changes-history {
        display: flex;
        flex-direction: column;
        flex: 1 1 0;
        min-height: 0;
        border-top: 1px solid var(--surface-border);
      }
      .changes-history-head {
        flex-shrink: 0;
        padding: var(--space-2) var(--space-3) var(--space-1);
        font-family: var(--font-mono);
        font-size: var(--text-xs);
        color: var(--text-tertiary);
      }
      .changes-history-empty {
        margin: 0;
        padding: var(--space-1) var(--space-3) var(--space-3);
        font-size: var(--text-sm);
        color: var(--text-tertiary);
      }
      /* Never scrolls — it renders exactly the number of rows that fit
         (COMMIT_ROW_HEIGHT in ChangesSection.js), so the strip ends where
         the remote button begins. */
      .changes-history-list {
        flex: 1 1 0;
        min-height: 0;
        overflow: hidden;
      }
      /* A fixed height, because the row count above is computed from it. */
      .commit-row {
        display: flex;
        align-items: center;
        gap: var(--space-2);
        height: 26px;
        box-sizing: border-box;
        padding: 0 var(--space-3);
      }
      .commit-row:hover {
        background: var(--surface-hover);
      }
      /* The subject is the line you read; the time and sha are markers. */
      .commit-subject {
        flex: 1;
        min-width: 0;
        font-size: var(--text-sm);
        color: var(--text-primary);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .commit-when,
      .commit-sha {
        flex-shrink: 0;
        font-family: var(--font-mono);
        font-size: var(--text-xs);
        color: var(--text-tertiary);
      }
      .changes-remote {
        align-self: flex-start;
        flex-shrink: 0;
        margin: var(--space-2) var(--space-2) var(--space-3);
      }

      /* ---- the commit box ---- */
      .changes-commit {
        display: flex;
        flex-direction: column;
        gap: var(--space-2);
        flex-shrink: 0;
        padding: var(--space-3);
        border-top: 1px solid var(--surface-border);
      }
      /* Deliberately plain — a field, not a card. The commit box used to be
         the largest object on screen for the thing touched least often. */
      .changes-message {
        width: 100%;
        box-sizing: border-box;
        resize: none;
        padding: var(--space-2);
        background: var(--surface-card);
        border: 1px solid var(--surface-border);
        border-radius: var(--radius-md);
        font-family: var(--font-sans);
        font-size: var(--text-sm);
        color: var(--text-primary);
      }
      .changes-message:focus {
        outline: none;
        border-color: var(--text-primary);
      }
      .changes-commit-actions {
        display: flex;
        align-items: center;
        gap: var(--space-2);
      }

      /* ---- File tab (see docs/design.md's "File tabs") ----
         The whole file, with its changes in place. Rows are a fixed height
         because the viewer windows them — only the visible slice is in the
         DOM, so a 10 000-line file costs the same as a short one. */
      /* flex/min-width:0 because this is a flex item of .content-flush: left
         at the default min-width:auto, its minimum size is its content's
         max-content width, and one long line of code would push the whole
         viewer wider than the pane instead of scrolling inside it. */
      .file-section {
        display: flex;
        flex-direction: column;
        flex: 1;
        min-width: 0;
        height: 100%;
        min-height: 0;
      }
      .file-head {
        display: flex;
        align-items: center;
        gap: var(--space-2);
        flex-shrink: 0;
        padding: var(--space-2) var(--space-3);
        border-bottom: 1px solid var(--surface-border);
      }
      .file-path {
        font-family: var(--font-mono);
        font-size: var(--text-xs);
        color: var(--text-secondary);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        direction: rtl;
        text-align: left;
      }
      .file-counts {
        display: flex;
        gap: var(--space-2);
        flex-shrink: 0;
        font-family: var(--font-mono);
        font-size: var(--text-xs);
      }
      .file-unchanged {
        flex-shrink: 0;
        font-family: var(--font-mono);
        font-size: var(--text-xs);
        color: var(--text-tertiary);
      }
      .file-head-spacer {
        flex: 1;
      }
      .file-jump {
        display: flex;
        align-items: center;
        gap: var(--space-1);
        flex-shrink: 0;
      }
      /* The shared .segmented sets align-self: flex-start for use in a
         column; in this row it has to sit on the header's centre line. */
      .file-head .segmented {
        align-self: center;
        flex-shrink: 0;
      }
      .file-jump-count {
        font-family: var(--font-mono);
        font-size: var(--text-xs);
        color: var(--text-tertiary);
      }
      .file-empty {
        display: flex;
        align-items: center;
        justify-content: center;
        flex: 1;
        padding: var(--space-5);
        color: var(--text-tertiary);
        font-size: var(--text-md);
      }
      .file-body {
        flex: 1;
        min-width: 0;
        min-height: 0;
        overflow: auto;
      }
      /* Width auto, so it fills the pane and tracks it as the pane is
         resized; min-width max-content, so a line longer than the pane makes
         it scroll instead of wrapping. `width: max-content` here instead
         shrink-wrapped to the longest line and left a changed line's tint
         stopping halfway across the pane. */
      .file-lines {
        position: relative;
        font-family: var(--font-mono);
        font-size: var(--text-xs);
        min-width: max-content;
      }
      .fileline {
        display: flex;
        align-items: center;
        width: 100%;
        white-space: pre;
      }
      /* Sticky, so scrolling a long line sideways doesn't lose the margin. */
      .fileline-no {
        position: sticky;
        left: 0;
        flex-shrink: 0;
        padding-right: var(--space-2);
        text-align: right;
        color: var(--text-tertiary);
        background: var(--app-bg);
        user-select: none;
      }
      .fileline-mark {
        width: 2ch;
        flex-shrink: 0;
        text-align: center;
        color: var(--text-tertiary);
        user-select: none;
      }
      .fileline-text {
        padding-right: var(--space-4);
        color: var(--text-primary);
      }
      .fileline-add {
        background: var(--diff-add-bg);
      }
      .fileline-add .fileline-no {
        background: var(--diff-add-bg);
      }
      .fileline-add .fileline-mark {
        color: var(--diff-add-mark);
      }
      .fileline-del {
        background: var(--diff-del-bg);
      }
      .fileline-del .fileline-no {
        background: var(--diff-del-bg);
      }
      .fileline-del .fileline-mark {
        color: var(--diff-del-mark);
      }
      .fileline-hunk {
        background: var(--diff-hunk-bg);
      }
      .file-truncated {
        margin: 0;
        padding: var(--space-3);
        font-family: var(--font-sans);
        font-size: var(--text-sm);
        color: var(--text-tertiary);
      }

      /* Syntax tokens (see src/shared/syntax.js). */
      .tok-keyword {
        color: var(--tok-keyword);
      }
      .tok-string {
        color: var(--tok-string);
      }
      .tok-number {
        color: var(--tok-number);
      }
      .tok-call {
        color: var(--tok-call);
      }
      .tok-comment {
        color: var(--tok-comment);
      }

      /* ---- ⌘P file palette ---- */
      .palette-scrim {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        padding-top: 12vh;
        background: var(--scrim);
      }
      .palette {
        display: flex;
        flex-direction: column;
        width: min(560px, 90vw);
        max-height: 60vh;
        background: var(--surface-card);
        border-radius: var(--radius-xl);
        box-shadow: var(--shadow-menu);
        overflow: hidden;
      }
      .palette-input {
        flex-shrink: 0;
        padding: var(--space-3) var(--space-4);
        background: transparent;
        border: none;
        border-bottom: 1px solid var(--surface-border);
        font-family: var(--font-sans);
        font-size: var(--text-lg);
        color: var(--text-primary);
      }
      .palette-input:focus {
        outline: none;
      }
      .palette-list {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        padding: var(--space-1);
      }
      .palette-item {
        display: flex;
        align-items: baseline;
        gap: var(--space-2);
        width: 100%;
        box-sizing: border-box;
        padding: var(--space-1) var(--space-3);
        border: none;
        border-radius: var(--radius-md);
        background: transparent;
        text-align: left;
        cursor: pointer;
      }
      .palette-item-active {
        background: var(--surface-bg);
      }
      .palette-name {
        flex-shrink: 0;
        font-family: var(--font-mono);
        font-size: var(--text-md);
        color: var(--text-primary);
      }
      .palette-dir {
        flex: 1;
        min-width: 0;
        font-family: var(--font-mono);
        font-size: var(--text-xs);
        color: var(--text-tertiary);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        direction: rtl;
        text-align: left;
      }
      .palette-empty {
        padding: var(--space-4);
        font-size: var(--text-md);
        color: var(--text-tertiary);
      }

    </style>
    <link rel="stylesheet" href="../shared/vendor/xterm/xterm.css" />
  </head>
  <body>
    <div id="root"></div>
    <script src="../shared/vendor/xterm/xterm.js"></script>
    <script src="../shared/vendor/xterm/addon-fit.js"></script>
    <script type="module" src="app.js"></script>
  </body>
</html>
