<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Clance</title>
    <link rel="stylesheet" href="../shared/theme.css" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--app-bg);
        color: var(--text-primary);
        font-family: var(--font-sans);
      }
      code {
        font-family: var(--font-mono);
      }

      /* ---- Shell ---- */
      .shell {
        display: flex;
        height: 100vh;
        box-sizing: border-box;
      }
      /* Only the pane occupying the window's actual top-left corner gets
         this — its tab bar is the only one that ever sits under the
         traffic lights (titleBarStyle: hiddenInset). See topLeftLeafId
         in Shell.js. Compound selector so it can't lose to `.tab-bar`'s
         own `padding` shorthand on source order. */
      .tab-bar.tab-bar-inset {
        padding-left: 96px;
      }
      /* Lives inline at the trailing end of whichever tab bar sits in the
         window's top-right corner — normal flow content, not an overlay,
         so it never fights the tab bar's own drag region or gets covered
         by it. See topRightLeafId in Shell.js. Stays flush at the true
         trailing edge because .tab-list (not this) is the flex: 1 space-
         filler now — a spacer here too would just split the remaining
         space between the two instead of ceding all of it to the tabs. */
      .launcher-cluster {
        -webkit-app-region: no-drag;
        display: flex;
        align-items: center;
        gap: 2px;
        align-self: center;
        flex-shrink: 0;
        padding-bottom: 4px;
      }
      .launcher-item {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 26px;
        height: 26px;
        flex-shrink: 0;
        background: transparent;
        border: none;
        border-radius: var(--radius-sm);
        color: var(--text-secondary);
        cursor: pointer;
        transition: background-color 0.12s ease, color 0.12s ease;
      }
      .launcher-item:hover {
        background: var(--surface-hover);
        color: var(--text-primary);
      }
      .launcher-item-active {
        background: var(--surface-card);
        color: var(--accent);
      }
      .status-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        flex-shrink: 0;
        margin: 0 4px;
      }
      .status-dot-ok {
        background: var(--success);
      }
      .status-dot-off {
        background: var(--text-secondary);
      }

      /* ---- Tab bar ---- */
      .shell-main {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
      }
      .tab-bar {
        display: flex;
        align-items: flex-end;
        gap: 2px;
        padding: 8px 8px 0;
        background: var(--surface-bg);
        border-bottom: 1px solid var(--surface-border);
        flex-shrink: 0;
        -webkit-app-region: drag;
      }
      /* The scrollable region for tabs, separate from .tab-bar itself —
         .tab-bar also carries the launcher-cluster (top-right corner
         buttons) as a sibling flex item. Without this wrapper, tabs and
         the launcher-cluster competed for the same row with no overflow
         boundary: past a certain tab count the whole row just grew wider
         than the window, dragging the corner buttons along with it instead
         of leaving them fixed in place. flex: 1 1 auto lets this absorb
         all the space the launcher-cluster doesn't need; min-width: 0
         overrides the flex-item default of min-width: auto, which would
         otherwise refuse to shrink below the tabs' natural total width and
         silently defeat overflow-x here. */
      .tab-list {
        display: flex;
        align-items: flex-end;
        gap: 2px;
        flex: 1 1 auto;
        min-width: 0;
        overflow-x: auto;
        overflow-y: hidden;
      }
      /* A near-invisible scroll affordance rather than a fully hidden one
         — thin enough to stay out of the way, present enough that an
         overflowing tab row doesn't look like it's just silently clipping
         content. */
      .tab-list::-webkit-scrollbar {
        height: 3px;
      }
      .tab-list::-webkit-scrollbar-thumb {
        background: var(--surface-border);
        border-radius: 2px;
      }
      .tab-list::-webkit-scrollbar-track {
        background: transparent;
      }
      .tab {
        -webkit-app-region: no-drag;
        display: flex;
        align-items: center;
        gap: 6px;
        max-width: 220px;
        flex-shrink: 0;
        padding: 7px 10px;
        border: 1px solid transparent;
        border-bottom: none;
        border-radius: var(--radius-md) var(--radius-md) 0 0;
        background: transparent;
        color: var(--text-secondary);
        font-size: 12.5px;
        font-family: inherit;
        cursor: pointer;
      }
      .tab-active {
        background: var(--app-bg);
        border-color: var(--surface-border);
        color: var(--text-primary);
        margin-bottom: -1px;
        padding-bottom: 8px;
      }
      .tab-icon {
        display: flex;
        flex-shrink: 0;
      }
      .tab-label {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .tab-close {
        display: flex;
        visibility: hidden;
        flex-shrink: 0;
        margin-left: 2px;
        border-radius: 4px;
        padding: 2px;
      }
      .tab-close:hover {
        background: var(--surface-active);
      }
      .tab:hover .tab-close,
      .tab-active .tab-close {
        visibility: visible;
      }

      .content {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        padding: 108px 120px 64px;
        position: relative;
      }
      .content-chat {
        padding: 0;
        overflow: hidden;
        display: flex;
      }
      /* Sits in the terminal's own 20px padding gutter (TerminalSection.js),
         not overlapping the xterm viewport itself — deliberately tiny and
         low-contrast so it doesn't compete with the terminal content. */
      .terminal-pop-out {
        position: absolute;
        top: 4px;
        right: 4px;
        z-index: 5;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 28px;
        height: 28px;
        background: transparent;
        border: none;
        border-radius: var(--radius-sm);
        color: var(--text-secondary);
        opacity: 0.5;
        cursor: pointer;
        transition: opacity 0.12s ease, background-color 0.12s ease, color 0.12s ease;
      }
      .terminal-pop-out:hover {
        opacity: 1;
        background: var(--surface-hover);
        color: var(--text-primary);
      }

      /* ---- Panes ---- */
      .pane-area {
        position: relative;
        flex: 1;
        min-width: 0;
        min-height: 0;
        display: flex;
      }
      .pane-split {
        flex: 1;
        min-width: 0;
        min-height: 0;
        display: flex;
      }
      .pane-split-row {
        flex-direction: row;
      }
      .pane-split-column {
        flex-direction: column;
      }
      .pane-split-child {
        min-width: 0;
        min-height: 0;
        display: flex;
      }
      .pane-leaf {
        flex: 1;
        min-width: 0;
        min-height: 0;
        display: flex;
        flex-direction: column;
      }
      .pane-divider {
        flex-shrink: 0;
        background: var(--surface-border);
        transition: background-color 0.12s ease;
      }
      .pane-divider-row {
        width: 5px;
        cursor: col-resize;
      }
      .pane-divider-column {
        height: 5px;
        cursor: row-resize;
      }
      .pane-divider:hover {
        background: var(--accent);
      }
      /* Inner: split just the hovered pane. Scoped to that pane's own
         content box, so these only ever coincide with the outer/whole-
         layout zones below along a pane that happens to sit at the true
         window edge — deliberately thinner than the outer zones so a
         window-edge pane is still reachable for a purely local split. */
      .pane-drop-edges {
        position: absolute;
        inset: 0;
        z-index: 5;
      }
      .pane-drop-edge {
        position: absolute;
        background: transparent;
        transition: background-color 0.12s ease;
      }
      .pane-drop-edge:hover {
        background: rgba(217, 119, 87, 0.16);
      }
      .pane-drop-edge-left {
        left: 0;
        top: 0;
        bottom: 0;
        width: 18%;
      }
      .pane-drop-edge-right {
        right: 0;
        top: 0;
        bottom: 0;
        width: 18%;
      }
      .pane-drop-edge-top {
        top: 0;
        left: 0;
        right: 0;
        height: 18%;
      }
      .pane-drop-edge-bottom {
        bottom: 0;
        left: 0;
        right: 0;
        height: 18%;
      }

      /* Outer: split the whole layout — spans every pane already inside
         it (a bar under two side-by-side panes, a third pane extending a
         row, etc.), not just the one under the cursor. Sits along the
         true edge of the pane area, above the inner zones (z-index) but
         only within its own thin strip, so it never blocks reaching an
         inner zone further in. */
      .pane-drop-edges-outer {
        position: absolute;
        inset: 0;
        z-index: 10;
        pointer-events: none;
      }
      .pane-drop-edge-outer {
        position: absolute;
        pointer-events: auto;
        background: transparent;
        border: 2px dashed transparent;
        box-sizing: border-box;
        transition: background-color 0.12s ease, border-color 0.12s ease;
      }
      .pane-drop-edge-outer:hover {
        background: rgba(217, 119, 87, 0.24);
        border-color: var(--accent);
      }
      .pane-drop-edge-outer-left {
        left: 0;
        top: 0;
        bottom: 0;
        width: 10%;
      }
      .pane-drop-edge-outer-right {
        right: 0;
        top: 0;
        bottom: 0;
        width: 10%;
      }
      .pane-drop-edge-outer-top {
        top: 0;
        left: 0;
        right: 0;
        height: 10%;
      }
      .pane-drop-edge-outer-bottom {
        bottom: 0;
        left: 0;
        right: 0;
        height: 10%;
      }

      .pane-preview {
        position: absolute;
        z-index: 20;
        pointer-events: none;
        background: rgba(217, 119, 87, 0.16);
        border: 2px solid var(--accent);
        border-radius: var(--radius-sm);
        box-sizing: border-box;
        transition: left 0.08s ease, top 0.08s ease, width 0.08s ease, height 0.08s ease;
      }

      .tab-drop-before {
        box-shadow: -2px 0 0 var(--accent) inset;
      }

      /* Follows the cursor during a pointer-based tab drag (see Shell.js —
         appended straight to document.body, outside the Preact tree, and
         positioned via transform on every pointermove; never goes through
         Preact state). */
      .tab-drag-ghost {
        position: fixed;
        top: 0;
        left: 0;
        z-index: 9999;
        pointer-events: none;
        background: var(--surface-elevated);
        border: 1px solid var(--accent);
        border-radius: var(--radius-sm);
        padding: 6px 12px;
        font-size: 12.5px;
        font-family: var(--font-sans);
        color: var(--text-primary);
        box-shadow: 0 4px 14px rgba(45, 41, 36, 0.18);
        white-space: nowrap;
      }

      /* ---- Page header ---- */
      .page-title {
        font-family: var(--font-serif);
        font-weight: 700;
        font-size: 30px;
        margin: 0 0 6px;
        color: var(--text-primary);
      }
      .page-subtitle {
        margin: 0 0 24px;
        color: var(--text-secondary);
        font-size: 14px;
      }
      .empty-note {
        color: var(--text-secondary);
        font-size: 13px;
      }
      .empty-note code {
        font-size: 12px;
        background: var(--surface-hover);
        border-radius: 4px;
        padding: 1px 5px;
      }

      /* ---- Buttons ---- */
      .btn-primary {
        background: var(--accent);
        color: var(--accent-contrast);
        border: none;
        border-radius: var(--radius-md);
        padding: 8px 16px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        font-family: inherit;
        transition: background-color 0.12s ease;
      }
      .btn-primary:hover {
        background: var(--accent-hover);
      }
      .btn-primary.btn-small {
        padding: 6px 12px;
        font-size: 12px;
      }
      .btn-secondary {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        background: var(--surface-elevated);
        color: var(--text-primary);
        border: 1px solid var(--surface-border);
        border-radius: var(--radius-md);
        padding: 8px 14px;
        font-size: 13px;
        cursor: pointer;
        font-family: inherit;
      }
      .btn-ghost {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        background: transparent;
        color: var(--accent);
        border: 1px solid var(--accent);
        border-radius: var(--radius-md);
        padding: 6px 12px;
        font-size: 11.5px;
        font-weight: 700;
        letter-spacing: 0.03em;
        text-transform: uppercase;
        cursor: pointer;
        font-family: inherit;
      }
      .btn-link {
        background: none;
        border: none;
        color: var(--accent);
        font-size: 12.5px;
        font-weight: 600;
        cursor: pointer;
        font-family: inherit;
        padding: 0;
      }

      /* ---- Search row (Chats) ---- */
      .search-row {
        display: flex;
        gap: 10px;
        margin-bottom: 32px;
      }
      /* "New Session" dropdown — same shape as the popup's "Open in..."
         one (default first, then recent directories, then Browse...), own
         CSS since this window and the popup are entirely separate
         documents with their own stylesheets. */
      .new-session-wrap {
        position: relative;
      }
      .new-session-dropdown {
        position: absolute;
        top: 100%;
        right: 0;
        margin-top: 6px;
        width: 320px;
        max-height: 340px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 3px;
        box-sizing: border-box;
        background: var(--surface-card);
        border: 1px solid var(--surface-border);
        border-radius: var(--radius-md);
        box-shadow: 0 8px 30px rgba(51, 44, 34, 0.16);
        padding: 8px;
        z-index: 10;
      }
      .dir-pick-row {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 2px;
        width: 100%;
        box-sizing: border-box;
        text-align: left;
        background: transparent;
        border: none;
        border-radius: var(--radius-sm);
        padding: 6px 8px;
        cursor: pointer;
        font-family: inherit;
        flex-shrink: 0;
      }
      .dir-pick-row:hover {
        background: var(--surface-hover);
      }
      .dir-pick-row-title {
        font-size: 13px;
        color: var(--text-primary);
      }
      .dir-pick-row-meta {
        font-size: 11px;
        color: var(--text-secondary);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        max-width: 100%;
      }
      .dir-pick-divider {
        height: 1px;
        background: var(--surface-border);
        margin: 2px 0;
        flex-shrink: 0;
      }
      .search-input {
        flex: 1;
        display: flex;
        align-items: center;
        gap: 8px;
        background: transparent;
        border: none;
        border-bottom: 1px solid var(--text-primary);
        border-radius: 0;
        padding: 6px 2px 10px;
        color: var(--text-secondary);
      }
      .search-input input {
        flex: 1;
        border: none;
        background: transparent;
        outline: none;
        font-family: var(--font-serif);
        font-style: italic;
        font-size: 15px;
        color: var(--text-primary);
      }
      .search-input input::placeholder {
        color: var(--text-secondary);
      }

      /* ---- List groups / item cards ---- */
      .list-group {
        margin-bottom: 20px;
      }
      .list-group-label {
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--text-secondary);
        margin-bottom: 8px;
      }
      .item-card {
        display: flex;
        align-items: flex-start;
        gap: 12px;
        width: 100%;
        box-sizing: border-box;
        text-align: left;
        background: transparent;
        border: none;
        border-bottom: 1px solid var(--surface-border);
        border-radius: 0;
        padding: 16px 2px;
        margin-bottom: 0;
        cursor: pointer;
        font-family: inherit;
        color: var(--text-primary);
      }
      .extension-group .item-card:last-child {
        border-bottom: none;
      }
      .item-card:hover .item-card-title {
        color: var(--accent);
      }
      .item-card-static {
        cursor: default;
      }
      .item-card-static:hover .item-card-title {
        color: var(--text-primary);
      }
      .item-card-icon {
        flex-shrink: 0;
        width: 20px;
        height: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-top: 2px;
        color: var(--text-secondary);
      }
      .item-card-icon-accent {
        color: var(--accent);
      }
      .item-card-body {
        min-width: 0;
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .item-card-title {
        font-family: var(--font-serif);
        font-size: 15.5px;
        font-weight: 600;
      }
      .item-card-meta {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        color: var(--text-secondary);
      }

      /* Dictated transcripts are prose, often several sentences, so unlike
         the single-line titles elsewhere in .item-card they wrap and keep
         their own line spacing. */
      /* Model rows carry three stacked lines, so they need to be tighter
         than the default .item-card or the list reads as very loose. */
      .dictation-model {
        padding: 12px 2px;
      }
      .dictation-model .item-card-body {
        gap: 3px;
      }
      .dictation-model .item-card-title {
        display: flex;
        align-items: baseline;
        gap: 8px;
        font-size: 14.5px;
      }

      /* Deliberately not .pill: a bordered box at this size fought the
         serif title next to it and read as a button. This is the same
         information as plain weighted text. */
      .dictation-badge {
        font-family: var(--font-sans);
        font-size: 9.5px;
        font-weight: 700;
        letter-spacing: 0.09em;
        text-transform: uppercase;
        color: var(--accent);
      }
      .dictation-badge-muted {
        color: var(--text-secondary);
      }

      /* Groups the dictation settings pane into labelled blocks. Without
         these the recommendation sentence floated between the microphone
         card and the model list, and the preference toggles ran straight on
         from the model rows as if they were more models. */
      .dictation-subsection {
        margin-top: 26px;
      }
      .dictation-subsection:first-child {
        margin-top: 0;
      }
      .dictation-subsection .list-group-label {
        margin-bottom: 6px;
      }
      .dictation-subsection .list-group {
        margin-bottom: 0;
      }
      .dictation-recommendation {
        margin: 0 0 10px;
      }

      .dictation-text {
        font-size: 13.5px;
        color: var(--text-primary);
        line-height: 1.5;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      /* Model download progress. A 500MB download needs a real bar — the
         percentage in the metadata line alone doesn't read as "working". */
      .install-bar {
        display: block;
        width: 100%;
        max-width: 260px;
        height: 3px;
        margin-top: 6px;
        background: var(--surface-border);
        border-radius: 2px;
        overflow: hidden;
      }
      .install-bar-fill {
        display: block;
        height: 100%;
        background: var(--accent);
        border-radius: 2px;
        transition: width 200ms linear;
      }
      /* Verifying and the Metal warm-up have no measurable progress, so the
         bar pulses at full width rather than sitting frozen at 100%. */
      .install-bar-fill-indeterminate {
        animation: install-pulse 1.4s ease-in-out infinite;
      }
      @keyframes install-pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.35; }
      }

      /* Copy is the only per-row action, so it's an icon rather than a text
         button — it doesn't need to compete with the transcript for
         attention. */
      .dictation-copy {
        background: none;
        border: none;
        padding: 4px;
        margin: -4px;
        border-radius: var(--radius-sm);
        color: var(--text-secondary);
      }
      .dictation-copy:hover {
        color: var(--text-primary);
        background: var(--surface-hover);
      }

      /* Date-range chips, custom range inputs, and the bulk-delete control,
         on one row beneath the search box. */
      .dictation-filters {
        display: flex;
        /* Baseline, not center: the chips carry underline padding below
           their text, so centring put "Delete all" visibly lower than them. */
        align-items: baseline;
        flex-wrap: wrap;
        gap: 12px;
        margin: 14px 0 6px;
      }
      /* The filters belong to the search box, so they sit close under it
         rather than after the Chats page's full section gap. */
      .search-row:has(+ .dictation-filters) {
        margin-bottom: 0;
      }
      /* The "isn't ready" notice is its own block above the history. */
      .dictation-notice {
        margin-bottom: 32px;
      }
      /* Lighter than the page-level .segmented: these are filters, not
         navigation, so they shouldn't carry a full-width underline. Two
         classes because .segmented is declared later in this sheet and
         would otherwise win, restoring its underline, 24px margin and gap. */
      .segmented.segmented-compact {
        gap: 14px;
        border-bottom: none;
        margin-bottom: 0;
      }
      .segmented-compact .segmented-item {
        font-size: 11.5px;
      }
      .dictation-custom-range {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .dictation-range-sep {
        font-size: 11.5px;
        color: var(--text-secondary);
      }
      /* Native date inputs arrive as a chunky grey Chromium control with a
         boxed calendar glyph, which reads as a foreign widget next to the
         flat filter chips. Stripped back to a plain underlined field in the
         app's own type.

         Both fields get the same explicit width: left to size themselves
         they came out visually mismatched, with the digits in one colliding
         with its calendar glyph and the other left with a wide gap. */
      .dictation-date {
        font-family: var(--font-sans);
        font-size: 11.5px;
        /* Explicit and identical, because Chromium's intrinsic width for a
           date input isn't stable between two otherwise identical fields
           (measured 84px vs 92px), which left the pair visibly misaligned.
           84px of content box against ~65px of text leaves room to spare:
           an earlier, tighter value clipped the last digit, and Chromium
           clips inside the input's shadow DOM *without* reporting overflow,
           so nothing catches that automatically — the test measures the
           text with canvas measureText instead. */
        width: 84px;
        box-sizing: content-box;
        color: var(--text-primary);
        background: transparent;
        border: none;
        border-bottom: 1px solid var(--surface-border);
        border-radius: 0;
        padding: 2px 0 3px;
        /* Text, not pointer: with the picker button hidden (below), the
           field is edited in place rather than opened. */
        cursor: text;
      }
      .dictation-date:hover {
        border-bottom-color: var(--text-secondary);
      }
      .dictation-date:focus {
        outline: none;
        border-bottom-color: var(--accent);
      }
      /* Hidden deliberately. The glyph is the only thing that opens
         Chromium's native calendar popover, and that popover is browser
         chrome — rendered outside the page and completely unstyleable, so
         it arrives with its own blue/orange highlights that clash with
         everything around it. Removing the button means it can never open,
         while the field stays fully editable: clicking a segment and typing
         digits, or arrow keys, are native date-input behaviour and
         unaffected. */
      .dictation-date::-webkit-calendar-picker-indicator {
        display: none;
      }
      /* Kills the grey inset field Chromium draws around the editable date
         parts, and tightens the separators — the default padding around
         each "-" made the date read as spaced-out digits. */
      .dictation-date::-webkit-datetime-edit {
        padding: 0;
      }
      .dictation-date::-webkit-datetime-edit-fields-wrapper {
        padding: 0;
        background: transparent;
      }
      .dictation-date::-webkit-datetime-edit-text {
        color: var(--text-secondary);
        padding: 0;
      }
      /* Pushed to the far end so a destructive action never sits directly
         beside the filter chips it would act on. */
      .dictation-bulk {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-left: auto;
      }
      .dictation-danger {
        color: var(--danger);
      }
      .dictation-danger:disabled {
        opacity: 0.5;
      }

      /* The transcription prompt is long-form text, so it gets a full-width
         block rather than the label-left/control-right .preference-row
         layout used by the toggles. */
      .dictation-prompt-row {
        padding: 14px 0;
        border-bottom: 1px solid var(--surface-border);
      }
      .dictation-prompt {
        width: 100%;
        box-sizing: border-box;
        margin-top: 10px;
        padding: 9px 11px;
        font-family: var(--font-mono);
        font-size: 12px;
        line-height: 1.55;
        color: var(--text-primary);
        background: var(--surface-bg);
        border: 1px solid var(--surface-border);
        border-radius: var(--radius-sm);
        resize: vertical;
      }
      .dictation-prompt:focus {
        /* Explicit: the platform default focus ring is a heavy amber box
           that doesn't belong in this palette. */
        outline: none;
        border-color: var(--accent);
      }
      .dictation-prompt-actions {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-top: 8px;
      }
      .item-card-description {
        font-size: 12.5px;
        font-style: italic;
        color: var(--text-secondary);
        line-height: 1.4;
      }
      .item-card-actions {
        flex-shrink: 0;
        display: flex;
        align-items: center;
        gap: 10px;
        margin-top: 2px;
      }
      /* ---- Conversation list rows (flat, newspaper-style listing) ---- */
      .session-row {
        display: flex;
        flex-direction: row;
        align-items: center;
        gap: 8px;
        width: 100%;
        box-sizing: border-box;
        text-align: left;
        background: transparent;
        border: none;
        border-bottom: 1px solid var(--surface-border);
        border-radius: 0;
        padding: 16px 4px;
        margin-bottom: 0;
        cursor: pointer;
        font-family: inherit;
        color: var(--text-primary);
      }
      .list-group:last-child .session-row:last-child {
        border-bottom: none;
      }
      .session-row-main {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 4px;
        flex: 1 1 auto;
        min-width: 0;
      }
      .session-row:hover .session-headline {
        color: var(--accent);
      }
      .session-headline {
        font-family: var(--font-serif);
        font-size: 17px;
        font-weight: 600;
        line-height: 1.3;
      }
      .session-byline {
        font-family: var(--font-sans);
        font-size: 11px;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        color: var(--text-secondary);
      }
      /* Hidden until the row is hovered, same pattern as .tab-close. */
      .session-archive-btn {
        display: flex;
        align-items: center;
        gap: 4px;
        flex-shrink: 0;
        visibility: hidden;
        background: transparent;
        border: none;
        border-radius: var(--radius-sm);
        padding: 5px 8px;
        color: var(--text-secondary);
        font-family: inherit;
        font-size: 11px;
        cursor: pointer;
      }
      .session-archive-btn:hover {
        background: var(--surface-hover);
        color: var(--text-primary);
      }
      .session-row:hover .session-archive-btn {
        visibility: visible;
      }
      .icon-button {
        display: flex;
        color: var(--text-secondary);
        cursor: pointer;
      }
      .pill {
        display: inline-flex;
        align-items: center;
        background: transparent;
        border: 1px solid var(--surface-border);
        border-radius: 2px;
        padding: 1px 6px;
        font-size: 10.5px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--text-secondary);
      }
      .pill-mono {
        font-family: var(--font-mono);
        text-transform: none;
        letter-spacing: 0;
        align-self: flex-start;
      }
      .pill-strong {
        border-color: var(--text-primary);
        color: var(--text-primary);
        font-weight: 700;
        letter-spacing: 0.03em;
        padding: 3px 8px;
      }
      .pill-muted {
        color: var(--text-secondary);
        font-size: 9px;
        font-weight: 700;
        margin-left: 6px;
      }

      /* ---- Segmented control (Skills sub-tabs) ---- */
      .segmented {
        display: flex;
        gap: 20px;
        border-bottom: 1px solid var(--surface-border);
        margin-bottom: 24px;
      }
      .segmented-item {
        background: none;
        border: none;
        border-bottom: 2px solid transparent;
        color: var(--text-secondary);
        font-size: 11.5px;
        font-weight: 600;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        padding: 0 0 10px;
        cursor: pointer;
        font-family: inherit;
      }
      .segmented-item-active {
        color: var(--text-primary);
        font-weight: 600;
        border-bottom-color: var(--accent);
      }

      .extension-group {
        margin-bottom: 40px;
      }
      .group-title {
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        margin: 0 0 4px;
        padding-bottom: 10px;
        border-bottom: 1px solid var(--text-primary);
        color: var(--text-primary);
      }
      .group-title-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 4px;
        padding-bottom: 10px;
        border-bottom: 1px solid var(--text-primary);
      }
      .group-title-row .group-title {
        margin: 0;
        padding-bottom: 0;
        border-bottom: none;
      }

      /* ---- Toggle switch ---- */
      .toggle {
        position: relative;
        width: 38px;
        height: 22px;
        border-radius: 11px;
        border: none;
        background: var(--surface-active);
        cursor: pointer;
        padding: 0;
        flex-shrink: 0;
        transition: background-color 0.15s ease;
      }
      .toggle-on {
        background: var(--accent);
      }
      .toggle-thumb {
        position: absolute;
        top: 2px;
        left: 2px;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: var(--surface-card);
        transition: transform 0.15s ease;
      }
      .toggle-on .toggle-thumb {
        transform: translateX(16px);
      }

      /* ---- Status rows (Settings, flat) ---- */
      .status-card {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 14px 0;
        border-bottom: 1px solid var(--surface-border);
      }
      .status-card-ok {
        color: var(--success);
      }
      .status-card-warn {
        color: var(--warning);
      }
      .status-card-icon {
        display: flex;
        flex-shrink: 0;
      }
      .status-card-body {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .status-card-title {
        font-family: var(--font-serif);
        font-size: 14.5px;
        font-weight: 600;
        color: var(--text-primary);
      }
      .status-card-description {
        font-size: 12.5px;
        color: var(--text-secondary);
      }

      /* ---- Preferences ---- */
      .preference-row,
      .permission-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 12px 0;
        border-bottom: 1px solid var(--surface-border);
      }
      .preference-title {
        font-family: var(--font-serif);
        font-size: 14.5px;
        font-weight: 600;
        color: var(--text-primary);
      }
      .preference-description {
        font-size: 12.5px;
        color: var(--text-secondary);
        margin-top: 2px;
      }
      .preference-description code {
        font-size: 11.5px;
      }
      .preference-row-actions {
        display: flex;
        align-items: center;
        gap: 14px;
        flex-shrink: 0;
      }
      /* Shortcut recorder. The field is a button rather than a text input:
         the combination is captured from real keypresses, never typed, so
         there's nothing to edit as text. */
      .shortcut-field-wrap {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-shrink: 0;
      }
      .shortcut-field {
        display: flex;
        align-items: center;
        gap: 4px;
        min-height: 26px;
        min-width: 86px;
        justify-content: flex-end;
        padding: 3px 6px;
        background: transparent;
        border: 1px solid transparent;
        border-radius: var(--radius-md);
        font-family: inherit;
        cursor: pointer;
      }
      .shortcut-field:hover {
        border-color: var(--surface-border);
        background: var(--surface-hover);
      }
      /* Recording is a deliberately loud state: the window is swallowing
         keystrokes and the app's global hotkeys are suspended, so it must
         be obvious that it's waiting for input. */
      .shortcut-field-recording {
        border-color: var(--accent);
        background: var(--accent-soft);
        justify-content: center;
        min-width: 130px;
      }
      .shortcut-key {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 22px;
        background: var(--surface-elevated);
        border: 1px solid var(--surface-border);
        border-radius: var(--radius-sm);
        padding: 2px 6px;
        font-family: var(--font-mono);
        font-size: 12px;
        color: var(--text-primary);
      }
      .shortcut-prompt {
        font-size: 12px;
        color: var(--accent);
      }
      .shortcut-hint {
        font-size: 11px;
        color: var(--text-secondary);
        white-space: nowrap;
      }
      .shortcut-hint-ok {
        color: var(--success);
      }
      /* Spans the row so a full sentence of explanation fits, rather than
         being squeezed into the right-hand control column. */
      .shortcut-error {
        margin: 0 0 10px;
        font-size: 12px;
      }

      .shortcut-display,
      .shortcut-edit {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-shrink: 0;
      }
      .kbd {
        display: inline-block;
        background: var(--surface-elevated);
        border: 1px solid var(--surface-border);
        border-radius: var(--radius-sm);
        padding: 3px 8px;
        font-family: var(--font-mono);
        font-size: 12px;
      }
      .shortcut-edit input {
        background: var(--surface-elevated);
        border: 1px solid var(--surface-border);
        border-radius: var(--radius-md);
        color: var(--text-primary);
        padding: 5px 8px;
        font-size: 13px;
        font-family: inherit;
      }
      .settings-footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-top: 24px;
        padding-top: 16px;
        border-top: 1px solid var(--surface-border);
        font-size: 12px;
        font-style: italic;
        color: var(--text-secondary);
      }

      .update-check {
        display: flex;
        align-items: baseline;
        gap: 10px;
      }
      .update-available {
        font-style: normal;
        font-weight: 600;
        color: var(--text-primary);
      }
      .update-command {
        font-style: normal;
        font-size: 11.5px;
        padding: 2px 6px;
        border-radius: var(--radius-sm);
        background: var(--surface-hover);
        color: var(--text-primary);
      }
      .settings-footer .btn-link {
        font-style: normal;
      }

      /* ---- Setup wizard (first-run flow, distinct from Settings) ---- */
      .setup-wizard {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        padding: 32px;
        box-sizing: border-box;
      }
      .setup-step {
        max-width: 440px;
        text-align: left;
      }
      .setup-step h2 {
        font-family: var(--font-serif);
        font-weight: 700;
        font-size: 26px;
        margin: 0 0 8px;
        color: var(--text-primary);
      }
      .setup-step p {
        color: var(--text-secondary);
        font-size: 14px;
        margin: 0 0 20px;
      }
      .setup-step .status-card {
        text-align: left;
      }
      .setup-step-actions {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-top: 20px;
      }
      .setup-step button {
        background: var(--accent);
        color: var(--accent-contrast);
        border: none;
        border-radius: var(--radius-md);
        padding: 8px 16px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        font-family: inherit;
        transition: background-color 0.12s ease;
      }
      .setup-step button:hover {
        background: var(--accent-hover);
      }
      .setup-step button:disabled {
        opacity: 0.6;
        cursor: default;
      }
      .setup-step .btn-secondary {
        background: transparent;
        color: var(--text-primary);
        border: 1px solid var(--surface-border);
      }
      .setup-step .btn-secondary:hover {
        background: var(--surface-hover);
      }

      /* Classed buttons and paragraphs inside a wizard step keep their own
         look. `.setup-step button` and `.setup-step p` exist to style a
         step's bare primary actions and body copy, but element+class
         specificity outranks a single component class — so every link-style
         button ("Restart Clance", Use/Remove, "Choose a different model"),
         every shortcut field, and every hint rendered as a filled orange
         button or oversized body text inside the wizard. */
      .setup-step .btn-link {
        background: none;
        border: none;
        border-radius: 0;
        padding: 0;
        color: var(--accent);
        font-size: 12.5px;
        font-weight: 600;
      }
      .setup-step .btn-link:hover {
        background: none;
        color: var(--accent-hover);
      }
      .setup-step .shortcut-field {
        background: transparent;
        color: inherit;
        border: 1px solid transparent;
        padding: 3px 6px;
        font-weight: inherit;
      }
      .setup-step .shortcut-field:hover {
        background: var(--surface-hover);
        border-color: var(--surface-border);
      }
      .setup-step .shortcut-field-recording,
      .setup-step .shortcut-field-recording:hover {
        background: var(--accent-soft);
        border-color: var(--accent);
      }
      /* A permission hint belongs to the card above it: it sits inside that
         card's row (the divider moves below the hint), indented to line up
         with the card's title and description (18px icon + 12px gap). */
      .setup-step .status-card:has(+ .setup-hint) {
        padding-bottom: 12px;
        border-bottom: none;
      }
      .setup-step .setup-hint {
        font-size: 12.5px;
        line-height: 1.5;
        margin: 0;
        padding: 0 0 14px 30px;
        border-bottom: 1px solid var(--surface-border);
      }
      .setup-step .preference-description {
        font-size: 12.5px;
        margin: 2px 0 0;
      }
      .setup-step .dictation-recommendation {
        margin: 0 0 10px;
      }
      .setup-optional {
        margin-left: 8px;
        font-family: var(--font-sans);
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.09em;
        text-transform: uppercase;
        vertical-align: middle;
        color: var(--text-secondary);
      }
      .setup-hint {
        font-size: 12.5px;
        color: var(--text-secondary);
        margin: 6px 0 2px;
      }
      .setup-hint .btn-link {
        margin-left: 4px;
      }
      .setup-error {
        color: var(--danger);
        font-size: 12px;
        margin: 8px 0 0;
      }
      .setup-success {
        color: var(--text-secondary);
        font-size: 12px;
        margin: 8px 0 0;
      }
      .shortcut-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 8px 0;
        border-bottom: 1px solid var(--surface-border);
        text-align: left;
      }
      .shortcut-row input {
        background: var(--surface-elevated);
        border: 1px solid var(--surface-border);
        border-radius: var(--radius-md);
        color: var(--text-primary);
        padding: 4px 8px;
        font-size: 13px;
        font-family: inherit;
      }
      .permission-row {
        text-align: left;
      }

      input[type="checkbox"] {
        accent-color: var(--accent);
      }

      .loading {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        color: var(--text-secondary);
      }
    </style>
    <link rel="stylesheet" href="../shared/vendor/xterm/xterm.css" />
  </head>
  <body>
    <div id="root"></div>
    <script src="../shared/vendor/xterm/xterm.js"></script>
    <script src="../shared/vendor/xterm/addon-fit.js"></script>
    <script type="module" src="app.js"></script>
  </body>
</html>
