<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Clance</title>
    <link rel="stylesheet" href="../shared/theme.css" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: transparent;
        color: var(--text-primary);
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
      }
      .shell {
        display: flex;
        height: 100vh;
        box-sizing: border-box;
      }
      .sidebar {
        width: 200px;
        flex-shrink: 0;
        display: flex;
        flex-direction: column;
        gap: 4px;
        padding: 52px 12px 12px;
        background: var(--surface-bg);
        border-right: 1px solid var(--surface-border);
      }
      .sidebar button {
        text-align: left;
        background: transparent;
        border: none;
        color: var(--text-secondary);
        font-size: 13px;
        padding: 8px 10px;
        border-radius: var(--radius-md);
        cursor: pointer;
        font-family: inherit;
      }
      .sidebar button:hover {
        background: var(--surface-hover);
        color: var(--text-primary);
      }
      .sidebar button.active {
        background: var(--surface-active);
        color: var(--text-primary);
      }
      .content {
        flex: 1;
        padding: 52px 32px 32px;
        overflow-y: auto;
      }
      .section-placeholder h2,
      .section-settings h2 {
        margin: 0 0 8px;
        color: var(--text-primary);
      }
      .section-placeholder p {
        color: var(--text-secondary);
      }
      .section-settings .setup-step {
        max-width: none;
        text-align: left;
        margin-bottom: 24px;
        padding-bottom: 16px;
        border-bottom: 1px solid var(--surface-border);
      }
      .setup-wizard {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        padding: 32px;
        box-sizing: border-box;
      }
      .setup-step {
        max-width: 420px;
        text-align: center;
      }
      .setup-step h2 {
        margin: 0 0 12px;
        color: var(--text-primary);
      }
      .setup-step p {
        color: var(--text-secondary);
        margin: 0 0 16px;
      }
      .setup-step button {
        background: var(--surface-active);
        color: var(--text-primary);
        border: 1px solid var(--surface-border);
        border-radius: var(--radius-md);
        padding: 8px 16px;
        font-size: 13px;
        cursor: pointer;
        margin: 4px;
        font-family: inherit;
      }
      .setup-error {
        color: rgba(255, 120, 120, 0.9);
        font-size: 12px;
        margin: 8px 0 0;
      }
      .setup-success {
        color: rgba(255, 255, 255, 0.6);
        font-size: 12px;
        margin: 8px 0 0;
      }
      .preference-row,
      .permission-row,
      .shortcut-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 8px 0;
        border-bottom: 1px solid var(--surface-border);
        text-align: left;
      }
      .theme-options {
        display: flex;
        gap: 4px;
      }
      .theme-options button {
        background: var(--surface-bg);
        border: 1px solid var(--surface-border);
        border-radius: var(--radius-md);
        color: var(--text-secondary);
        padding: 4px 12px;
        font-size: 12.5px;
        cursor: pointer;
        font-family: inherit;
      }
      .theme-options button.active {
        background: var(--surface-active);
        color: var(--text-primary);
      }
      .shortcut-row input {
        background: var(--surface-bg);
        border: 1px solid var(--surface-border);
        border-radius: var(--radius-md);
        color: var(--text-primary);
        padding: 4px 8px;
        font-size: 13px;
        font-family: inherit;
      }
      .chat-history-empty {
        color: var(--text-secondary);
      }
      .chat-history-list {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .chat-history-item {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 2px;
        width: 100%;
        text-align: left;
        background: transparent;
        border: none;
        border-bottom: 1px solid var(--surface-border);
        color: var(--text-primary);
        padding: 10px 4px;
        cursor: pointer;
        font-family: inherit;
      }
      .chat-history-item:hover {
        background: var(--surface-hover);
      }
      .chat-history-item-title {
        font-size: 13.5px;
      }
      .chat-history-item-meta {
        font-size: 12px;
        color: var(--text-secondary);
      }
      .chat-history-back {
        background: transparent;
        border: none;
        color: var(--text-secondary);
        font-size: 12.5px;
        cursor: pointer;
        padding: 0 0 12px;
        font-family: inherit;
      }
      .chat-history-back:hover {
        color: var(--text-primary);
      }
      .chat-history-detail-title {
        margin: 0 0 2px;
        color: var(--text-primary);
      }
      .chat-history-detail-meta {
        margin: 0 0 16px;
        color: var(--text-secondary);
        font-size: 12.5px;
      }
      .chat-history-transcript {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      .chat-turn {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .chat-turn-user .chat-turn-text {
        color: var(--text-secondary);
        font-size: 13px;
      }
      .chat-turn-assistant .chat-turn-text {
        color: var(--text-primary);
        font-size: 13.5px;
        line-height: 1.5;
      }
      .chat-turn-thinking,
      .chat-turn-tool {
        font-size: 12px;
        font-style: italic;
        color: var(--text-secondary);
      }
      .chat-turn-text p {
        margin: 0 0 8px;
      }
      .chat-turn-text p:last-child {
        margin-bottom: 0;
      }
      .chat-turn-text code {
        font-family: ui-monospace, "SF Mono", Menlo, monospace;
        font-size: 12px;
        background: var(--surface-hover);
        border-radius: 4px;
        padding: 1px 5px;
      }
      .chat-turn-text pre {
        background: var(--surface-bg);
        border: 1px solid var(--surface-border);
        border-radius: 8px;
        padding: 10px 12px;
        margin: 8px 0;
        overflow-x: auto;
      }
      .chat-turn-text pre code {
        background: none;
        padding: 0;
      }
      .loading {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        color: var(--text-secondary);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="app.js"></script>
  </body>
</html>
