<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Dictation</title>
    <link rel="stylesheet" href="../shared/theme.css" />
    <link rel="stylesheet" href="../shared/components.css" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: transparent;
        font-family: var(--font-sans);
        font-weight: var(--weight-regular);
        -webkit-font-smoothing: antialiased;
        /* The window is non-focusable, but a stray text selection or drag
           inside it would still look broken, and there is nothing here to
           select. */
        user-select: none;
        cursor: default;
        overflow: hidden;
      }

      /* A compact pill rather than a card. While recording it shows only a
         dot, the level meter and elapsed time — the meter is the actual
         signal the user needs (is it hearing me?), and prose would just
         make the window bigger for no gain. Text appears only in the
         states that genuinely need words. */
      #hud {
        display: flex;
        align-items: center;
        gap: 10px;
        box-sizing: border-box;
        height: 100%;
        padding: 0 14px;
        border-radius: 18px;
        background: var(--surface-card);
        box-shadow: var(--shadow-overlay);
      }

      #dot {
        flex: 0 0 auto;
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--recording);
        animation: pulse 1.4s ease-in-out infinite;
      }
      #hud.state-transcribing #dot {
        background: var(--signal);
        animation: pulse 0.9s ease-in-out infinite;
      }
      #hud.state-done #dot {
        background: var(--success);
        animation: none;
      }
      #hud.state-error #dot,
      #hud.state-unavailable #dot {
        background: var(--warning);
        animation: none;
      }
      /* Nothing heard is not a problem, so it stays neutral. */
      #hud.state-empty #dot {
        background: var(--text-tertiary);
        animation: none;
      }
      #hud.state-failed #dot {
        background: var(--danger);
        animation: none;
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.25;
        }
      }

      /* Live input level. Bars rather than one meter so it reads as a
         microphone at a glance, and because the most common dictation
         failure is talking into a muted or wrong input device. */
      #meter {
        flex: 1 1 auto;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 2px;
        height: 16px;
        min-width: 0;
      }
      #meter span {
        width: 3px;
        min-height: 3px;
        border-radius: 2px;
        background: var(--surface-border);
        transition: height 80ms linear, background 120ms linear;
      }
      #meter span.on {
        background: var(--text-primary);
      }
      #hud:not(.state-recording) #meter {
        display: none;
      }

      #label {
        flex: 1 1 auto;
        min-width: 0;
        font-size: var(--text-sm);
        font-weight: var(--weight-medium);
        color: var(--text-primary);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      /* Hidden while recording: the meter says everything a label would. */
      #hud.state-recording #label {
        display: none;
      }

      #elapsed {
        flex: 0 0 auto;
        font-family: var(--font-mono);
        font-size: var(--text-xs);
        color: var(--text-secondary);
        font-variant-numeric: tabular-nums;
      }
      #hud:not(.state-recording) #elapsed {
        display: none;
      }
      /* A quiet mono link, e.g. "open settings", on states the user can fix. */
      #action {
        flex: 0 0 auto;
        padding: 0;
        border: none;
        background: transparent;
        font-family: var(--font-mono);
        font-size: var(--text-xs);
        color: var(--text-secondary);
        cursor: pointer;
      }
      #action:hover {
        color: var(--text-primary);
        text-decoration: underline;
      }
      #action[hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="hud" class="state-recording">
      <div id="dot"></div>
      <div id="label">Listening…</div>
      <div id="meter"></div>
      <div id="elapsed">0:00</div>
      <button id="action" type="button" hidden></button>
    </div>
    <script type="module" src="./hud.js"></script>
  </body>
</html>
