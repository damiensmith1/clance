<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Clance</title>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        background: rgba(30, 30, 30, 0.92);
        color: #eee;
        font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        border-radius: 12px;
        overflow: hidden;
      }
      #app {
        display: flex;
        flex-direction: column;
        height: 100%;
        box-sizing: border-box;
        padding: 12px;
      }
      #goal {
        width: 100%;
        box-sizing: border-box;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 8px;
        color: inherit;
        font-size: 14px;
        padding: 10px;
        outline: none;
      }
      #response {
        flex: 1;
        margin-top: 10px;
        overflow-y: auto;
        white-space: pre-wrap;
        font-size: 13px;
        line-height: 1.4;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <input id="goal" type="text" placeholder="What do you want to do?" autofocus />
      <div id="response"></div>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
