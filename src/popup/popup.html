<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Clance</title>
    <link rel="stylesheet" href="../shared/theme.css" />
    <link rel="stylesheet" href="../shared/vendor/xterm/xterm.css" />
    <style>
      html, body {
        margin: 0;
        height: 100%;
        background: transparent;
        font-family: var(--font-sans);
        -webkit-font-smoothing: antialiased;
      }

      /* The window is now user-resizable (drag its edges/corners) instead
         of sized to fit its content — #app just fills whatever size the
         window is, rather than growing up to a fixed max-height. */
      #app {
        position: relative;
        display: flex;
        flex-direction: column;
        height: 100%;
        box-sizing: border-box;
        padding: 14px;
        border-radius: var(--radius-lg);
        overflow: hidden;
        background: var(--surface-card);
        border: 1px solid var(--surface-border);
        box-shadow: 0 8px 30px rgba(51, 44, 34, 0.16);
        gap: 10px;
      }

      #session {
        order: 2;
        display: none;
        flex: 1 1 auto;
        min-height: 0;
        box-sizing: border-box;
        flex-direction: column;
        border: 1px solid var(--surface-border);
        border-radius: var(--radius-md);
        overflow: hidden;
      }
      #app.has-messages #session {
        display: flex;
      }

      /* Persistent across both modes (unlike the old #session-header,
         which only existed inside the terminal view) — this is the
         widget's only chrome now that dismissal is never automatic, so a
         close button has to live somewhere always on-screen. It's also
         the widget's drag handle (-webkit-app-region: drag), since there's
         no native title bar to grab (frame: false) — buttons inside it
         opt back out with no-drag so they stay clickable. */
      #toolbar {
        order: 1;
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 2px;
        font-size: 10.5px;
        font-weight: 700;
        letter-spacing: 0.06em;
        color: var(--text-secondary);
        flex-shrink: 0;
        -webkit-app-region: drag;
      }
      .status-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--success);
        flex-shrink: 0;
      }
      .toolbar-spacer {
        flex: 1 1 auto;
      }
      .toolbar-btn {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 22px;
        height: 22px;
        padding: 0;
        background: transparent;
        border: none;
        border-radius: var(--radius-sm);
        color: var(--text-secondary);
        cursor: pointer;
        -webkit-app-region: no-drag;
      }
      .toolbar-btn:hover {
        background: var(--surface-hover);
        color: var(--text-primary);
      }
      /* Only makes sense once there's a live session to move. */
      #open-in-app-btn {
        display: none;
      }
      #app.has-messages #open-in-app-btn {
        display: flex;
      }

      /* "Open in…" — a plain toolbar button (unlike #context-link, this one
         actually does something on click) that opens an anchored dropdown
         (not a full mode swap, the way the old full-screen session picker
         worked). Sits near the CLAUDE label on the left, with extra
         breathing room (margin-left, beyond #toolbar's own flex gap)
         between the two so it doesn't read as part of the label. */
      #open-in-wrap {
        position: relative;
        margin-left: 4px;
        -webkit-app-region: no-drag;
      }
      .toolbar-text-btn {
        background: transparent;
        border: none;
        padding: 0;
        margin: 0;
        font: inherit;
        font-size: 9px;
        color: inherit;
        cursor: pointer;
      }
      .toolbar-text-btn:hover {
        color: var(--text-primary);
      }
      #open-in-dropdown {
        display: none;
        position: absolute;
        top: 100%;
        /* Anchored from the left edge — it sits near the left side of the
           toolbar now, so extending rightward from the button is what
           keeps it clear of the window's edges (the opposite reasoning
           from #context-dialog, which sits on the right and anchors from
           its own right edge instead). */
        left: 0;
        margin-top: 6px;
        width: 460px;
        max-height: 340px;
        flex-direction: column;
        gap: 6px;
        box-sizing: border-box;
        background: var(--surface-card);
        border: 1px solid var(--surface-border);
        border-radius: var(--radius-md);
        box-shadow: 0 8px 30px rgba(51, 44, 34, 0.16);
        padding: 8px;
        text-align: left;
        font-weight: 400;
        letter-spacing: normal;
        text-transform: none;
        color: var(--text-primary);
        font-size: 13px;
        cursor: default;
        z-index: 10;
      }
      #open-in-dropdown.open {
        display: flex;
      }
      #open-in-search {
        width: 100%;
        box-sizing: border-box;
        background: var(--surface-bg);
        border: 1px solid var(--surface-border);
        border-radius: var(--radius-sm);
        color: var(--text-primary);
        font-family: inherit;
        font-size: 13px;
        padding: 7px 9px;
        outline: none;
        flex-shrink: 0;
      }
      #open-in-list {
        flex: 1 1 auto;
        min-height: 0;
        max-height: 280px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 3px;
      }
      .open-in-row {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 2px;
        width: 100%;
        box-sizing: border-box;
        text-align: left;
        background: transparent;
        border: none;
        border-radius: var(--radius-sm);
        padding: 6px 8px;
        cursor: pointer;
        font-family: inherit;
      }
      .open-in-row:hover {
        background: var(--surface-hover);
      }
      .open-in-row-title {
        font-size: 13px;
        color: var(--text-primary);
      }
      .open-in-row-meta {
        font-size: 11px;
        color: var(--text-secondary);
      }

      /* Plain text, not a button — hovering reveals what was actually
         captured and handed to the CLI at invocation, so the wording
         doesn't imply a click does anything. */
      #context-link {
        position: relative;
        -webkit-app-region: no-drag;
        cursor: default;
        color: var(--text-secondary);
      }
      #context-link:hover {
        color: var(--text-primary);
      }
      /* No margin-top gap between the link and the card on purpose — a
         real gap is a dead zone the mouse has to cross in a straight line
         to get from the text to the card, and leaving either one during
         that crossing (easy to do, especially aiming for a scrollbar)
         drops :hover and closes it. Flush against the link instead, so
         there's no gap to fall through; the card's own padding still
         gives its content breathing room. */
      #context-dialog {
        display: none;
        position: absolute;
        top: 100%;
        right: 0;
        width: 480px;
        max-height: 560px;
        overflow-y: auto;
        box-sizing: border-box;
        background: var(--surface-card);
        border: 1px solid var(--surface-border);
        border-radius: var(--radius-md);
        box-shadow: 0 8px 30px rgba(51, 44, 34, 0.16);
        margin-top: 0;
        padding: 14px;
        text-align: left;
        font-weight: 400;
        letter-spacing: normal;
        text-transform: none;
        color: var(--text-primary);
        font-size: 13px;
        cursor: default;
        z-index: 10;
      }
      #context-link:hover #context-dialog {
        display: block;
      }
      /* One scrollbar for the whole card (#context-dialog's own
         overflow-y) rather than nested scroll areas per section — simpler
         to use, and avoids the mouse-wheel-bubbling ambiguity of a
         scrollable block inside a scrollable card. */
      .context-dialog-label {
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        color: var(--text-secondary);
        margin: 14px 0 5px;
      }
      .context-dialog-label:first-child {
        margin-top: 0;
      }
      #context-dialog-image {
        width: 100%;
        display: block;
        border-radius: var(--radius-sm);
        border: 1px solid var(--surface-border);
      }
      #context-dialog-title {
        font-weight: 600;
        word-break: break-word;
      }
      #context-dialog-selection,
      #context-dialog-system-prompt {
        white-space: pre-wrap;
        word-break: break-word;
        background: var(--surface-bg);
        border-radius: var(--radius-sm);
        padding: 10px;
        font-family: var(--font-mono);
        font-size: 11.5px;
      }
      #context-dialog-empty {
        color: var(--text-secondary);
        font-style: italic;
      }

      /* FitAddon sizes rows/cols off the mount element's *direct parent*
       * clientHeight/Width without ever subtracting that parent's own
       * padding (a known xterm.js limitation) — so the padding lives here,
       * on the outer wrapper, while xterm mounts into the padding-free
       * #term-inner below, or the computed row/col count overshoots the
       * actually-visible area. */
      #term-mount {
        flex: 1 1 auto;
        min-height: 0;
        background: #F7F3EB;
        padding: 14px;
        box-sizing: border-box;
      }
      #term-inner {
        width: 100%;
        height: 100%;
      }

      .note {
        font-size: 12px;
        font-style: italic;
        color: var(--text-secondary);
        padding: 0 12px;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="toolbar">
        <span class="status-dot"></span>CLAUDE
        <span id="open-in-wrap">
          <button id="open-in-btn" class="toolbar-text-btn" title="Open a past conversation">
            Open in…
          </button>
          <div id="open-in-dropdown">
            <input id="open-in-search" type="text" placeholder="Search conversations…" />
            <div id="open-in-list"></div>
          </div>
        </span>
        <div class="toolbar-spacer"></div>
        <span id="context-link">
          See context
          <div id="context-dialog">
            <div id="context-dialog-title" hidden></div>
            <div id="context-dialog-image-label" class="context-dialog-label" hidden>Screenshot</div>
            <img id="context-dialog-image" hidden alt="Screenshot at invocation" />
            <div id="context-dialog-selection-label" class="context-dialog-label" hidden>Highlighted text</div>
            <div id="context-dialog-selection" hidden></div>
            <div id="context-dialog-system-prompt-label" class="context-dialog-label" hidden>System prompt</div>
            <div id="context-dialog-system-prompt" hidden></div>
            <div id="context-dialog-empty" hidden>No context was captured for this session.</div>
          </div>
        </span>
        <button id="open-in-app-btn" class="toolbar-btn" title="Open in App">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 13v6a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h6" />
            <path d="M20 4L10 14M10 8v6h6" />
          </svg>
        </button>
        <button id="close-btn" class="toolbar-btn" title="Close">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 6l12 12M18 6L6 18" />
          </svg>
        </button>
      </div>
      <div id="session">
        <div id="term-mount"><div id="term-inner"></div></div>
      </div>
    </div>
    <script src="../shared/vendor/xterm/xterm.js"></script>
    <script src="../shared/vendor/xterm/addon-fit.js"></script>
    <script type="module" src="popup.js"></script>
  </body>
</html>
