<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Clance</title>
    <link rel="stylesheet" href="../shared/theme.css" />
    <style>
      html, body {
        margin: 0;
        background: transparent;
        font-family: var(--font-sans);
        -webkit-font-smoothing: antialiased;
      }

      #app {
        position: relative;
        display: flex;
        flex-direction: column;
        max-height: 480px;
        box-sizing: border-box;
        padding: 16px 20px;
        border-radius: var(--radius-lg);
        overflow: hidden;
        background: var(--surface-elevated);
        border: 1px solid var(--surface-border);
        box-shadow: 0 8px 30px rgba(51, 44, 34, 0.16);
      }

      #goal {
        position: relative;
        order: 1;
        width: 100%;
        box-sizing: border-box;
        background: transparent;
        border: none;
        border-bottom: 1px solid var(--surface-border);
        color: var(--text-primary);
        font-family: inherit;
        font-size: 14px;
        padding: 4px 2px 12px;
        outline: none;
        flex-shrink: 0;
      }
      #goal::placeholder {
        color: var(--text-secondary);
      }
      #goal:disabled {
        opacity: 0.5;
      }

      /* Once a conversation starts, the input moves below the transcript. */
      #app.has-messages #goal {
        border-bottom: none;
        border-top: 1px solid var(--surface-border);
        padding: 12px 2px 4px;
        order: 2;
      }

      #transcript {
        position: relative;
        order: 2;
        flex: 1 1 auto;
        min-height: 0;
        margin-top: 14px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 16px;
        padding-right: 4px;
      }
      #transcript:empty {
        margin-top: 0;
      }
      #app.has-messages #transcript {
        order: 1;
        margin-top: 0;
        margin-bottom: 14px;
      }
      #transcript::-webkit-scrollbar {
        width: 5px;
      }
      #transcript::-webkit-scrollbar-thumb {
        background: var(--surface-active);
        border-radius: 3px;
      }

      .turn {
        animation: turn-in 0.15s ease;
      }
      @keyframes turn-in {
        from { opacity: 0; transform: translateY(4px); }
        to { opacity: 1; transform: translateY(0); }
      }

      .turn-prompt {
        font-size: 12.5px;
        color: var(--text-secondary);
        margin-bottom: 4px;
      }

      .turn-reply {
        font-size: 13.5px;
        line-height: 1.5;
        color: var(--text-primary);
        overflow-wrap: anywhere;
      }
      .turn-reply p {
        margin: 0 0 8px;
      }
      .turn-reply p:last-child {
        margin-bottom: 0;
      }
      .turn-reply h1,
      .turn-reply h2,
      .turn-reply h3 {
        margin: 12px 0 6px;
        font-weight: 600;
        color: var(--text-primary);
      }
      .turn-reply h1 { font-size: 15px; }
      .turn-reply h2 { font-size: 14px; }
      .turn-reply h3 { font-size: 13.5px; }
      .turn-reply ul,
      .turn-reply ol {
        margin: 0 0 8px;
        padding-left: 20px;
      }
      .turn-reply li {
        margin-bottom: 2px;
      }
      .turn-reply strong {
        font-weight: 600;
        color: var(--text-primary);
      }
      .turn-reply code {
        font-family: var(--font-mono);
        font-size: 12px;
        background: var(--surface-hover);
        border-radius: 4px;
        padding: 1px 5px;
      }
      .turn-reply pre {
        background: var(--surface-bg);
        border: 1px solid var(--surface-border);
        border-radius: var(--radius-md);
        padding: 10px 12px;
        margin: 8px 0;
        overflow-x: auto;
      }
      .turn-reply pre code {
        background: none;
        padding: 0;
        font-size: 12px;
        line-height: 1.5;
        white-space: pre;
      }

      .note {
        font-size: 12px;
        font-style: italic;
        color: var(--text-secondary);
      }

      .typing {
        display: inline-flex;
        gap: 4px;
        padding: 2px 0;
      }
      .typing span {
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: var(--text-secondary);
        animation: typing-blink 1.2s infinite ease-in-out;
      }
      .typing span:nth-child(2) { animation-delay: 0.2s; }
      .typing span:nth-child(3) { animation-delay: 0.4s; }
      @keyframes typing-blink {
        0%, 80%, 100% { opacity: 0.25; }
        40% { opacity: 1; }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <input id="goal" type="text" placeholder="What do you want to do?" autofocus />
      <div id="transcript"></div>
    </div>
    <script type="module" src="popup.js"></script>
  </body>
</html>
