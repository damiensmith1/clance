<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Clance</title>
    <link rel="stylesheet" href="../shared/theme.css" />
    <link rel="stylesheet" href="../shared/vendor/xterm/xterm.css" />
    <style>
      html, body {
        margin: 0;
        height: 100%;
        background: transparent;
        font-family: var(--font-sans);
        -webkit-font-smoothing: antialiased;
      }

      /* The window is now user-resizable (drag its edges/corners) instead
         of sized to fit its content — #app just fills whatever size the
         window is, rather than growing up to a fixed max-height. */
      #app {
        position: relative;
        display: flex;
        flex-direction: column;
        height: 100%;
        box-sizing: border-box;
        padding: 14px;
        border-radius: var(--radius-lg);
        overflow: hidden;
        background: var(--surface-card);
        border: 1px solid var(--surface-border);
        box-shadow: 0 8px 30px rgba(51, 44, 34, 0.16);
        gap: 10px;
      }

      #session {
        order: 2;
        display: none;
        flex: 1 1 auto;
        min-height: 0;
        box-sizing: border-box;
        flex-direction: column;
        border: 1px solid var(--surface-border);
        border-radius: var(--radius-md);
        overflow: hidden;
      }
      #app.has-messages #session {
        display: flex;
      }

      /* Persistent across both modes (unlike the old #session-header,
         which only existed inside the terminal view) — this is the
         widget's only chrome now that dismissal is never automatic, so a
         close button has to live somewhere always on-screen. It's also
         the widget's drag handle (-webkit-app-region: drag), since there's
         no native title bar to grab (frame: false) — buttons inside it
         opt back out with no-drag so they stay clickable. */
      #toolbar {
        order: 1;
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 2px;
        font-size: 10.5px;
        font-weight: 700;
        letter-spacing: 0.06em;
        color: var(--text-secondary);
        flex-shrink: 0;
        -webkit-app-region: drag;
      }
      .status-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--success);
        flex-shrink: 0;
      }
      .toolbar-spacer {
        flex: 1 1 auto;
      }
      .toolbar-btn {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 22px;
        height: 22px;
        padding: 0;
        background: transparent;
        border: none;
        border-radius: var(--radius-sm);
        color: var(--text-secondary);
        cursor: pointer;
        -webkit-app-region: no-drag;
      }
      .toolbar-btn:hover {
        background: var(--surface-hover);
        color: var(--text-primary);
      }
      /* Only makes sense once there's a live session to move. */
      #open-in-app-btn {
        display: none;
      }
      #app.has-messages #open-in-app-btn {
        display: flex;
      }

      /* FitAddon sizes rows/cols off the mount element's *direct parent*
       * clientHeight/Width without ever subtracting that parent's own
       * padding (a known xterm.js limitation) — so the padding lives here,
       * on the outer wrapper, while xterm mounts into the padding-free
       * #term-inner below, or the computed row/col count overshoots the
       * actually-visible area. */
      #term-mount {
        flex: 1 1 auto;
        min-height: 0;
        background: #F7F3EB;
        padding: 14px;
        box-sizing: border-box;
      }
      #term-inner {
        width: 100%;
        height: 100%;
      }

      /* ---- Session picker mode ---- */
      #picker {
        display: none;
        order: 2;
        flex: 1 1 auto;
        min-height: 0;
        flex-direction: column;
        gap: 8px;
      }
      #app.picker-active #picker {
        display: flex;
      }
      #app.picker-active #session {
        display: none;
      }
      #picker-search {
        width: 100%;
        box-sizing: border-box;
        background: var(--surface-bg);
        border: 1px solid var(--surface-border);
        border-radius: var(--radius-md);
        color: var(--text-primary);
        font-family: inherit;
        font-size: 13px;
        padding: 8px 10px;
        outline: none;
        flex-shrink: 0;
      }
      #picker-list {
        flex: 1 1 auto;
        min-height: 0;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .picker-row {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 2px;
        width: 100%;
        box-sizing: border-box;
        text-align: left;
        background: transparent;
        border: none;
        border-radius: var(--radius-md);
        padding: 7px 8px;
        cursor: pointer;
        font-family: inherit;
      }
      .picker-row:hover {
        background: var(--surface-hover);
      }
      .picker-row-title {
        font-size: 13px;
        color: var(--text-primary);
      }
      .picker-row-meta {
        font-size: 11px;
        color: var(--text-secondary);
      }
      .note {
        font-size: 12px;
        font-style: italic;
        color: var(--text-secondary);
        padding: 0 12px;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="toolbar">
        <span class="status-dot"></span>CLAUDE
        <div class="toolbar-spacer"></div>
        <button id="open-in-app-btn" class="toolbar-btn" title="Open in App">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 13v6a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h6" />
            <path d="M20 4L10 14M10 8v6h6" />
          </svg>
        </button>
        <button id="close-btn" class="toolbar-btn" title="Close">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 6l12 12M18 6L6 18" />
          </svg>
        </button>
      </div>
      <div id="session">
        <div id="term-mount"><div id="term-inner"></div></div>
      </div>
      <div id="picker">
        <input id="picker-search" type="text" placeholder="Search conversations…" />
        <div id="picker-list"></div>
      </div>
    </div>
    <script src="../shared/vendor/xterm/xterm.js"></script>
    <script src="../shared/vendor/xterm/addon-fit.js"></script>
    <script type="module" src="popup.js"></script>
  </body>
</html>
