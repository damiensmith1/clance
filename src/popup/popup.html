<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Clance</title>
    <link rel="stylesheet" href="../shared/theme.css" />
    <link rel="stylesheet" href="../shared/vendor/xterm/xterm.css" />
    <style>
      html, body {
        margin: 0;
        background: transparent;
        font-family: var(--font-sans);
        -webkit-font-smoothing: antialiased;
      }

      #app {
        position: relative;
        display: flex;
        flex-direction: column;
        max-height: 480px;
        box-sizing: border-box;
        padding: 14px;
        border-radius: var(--radius-lg);
        overflow: hidden;
        background: var(--surface-card);
        border: 1px solid var(--surface-border);
        box-shadow: 0 8px 30px rgba(51, 44, 34, 0.16);
        gap: 10px;
      }

      #session {
        order: 1;
        display: none;
        height: 452px;
        box-sizing: border-box;
        flex-direction: column;
        border: 1px solid var(--surface-border);
        border-radius: var(--radius-md);
        overflow: hidden;
      }
      #app.has-messages #session {
        display: flex;
      }

      #session-header {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 8px 12px;
        font-size: 10.5px;
        font-weight: 700;
        letter-spacing: 0.06em;
        color: var(--text-secondary);
        border-bottom: 1px solid var(--surface-border);
        flex-shrink: 0;
      }
      .status-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--success);
        flex-shrink: 0;
      }

      /* FitAddon sizes rows/cols off the mount element's *direct parent*
       * clientHeight/Width without ever subtracting that parent's own
       * padding (a known xterm.js limitation) — so the padding lives here,
       * on the outer wrapper, while xterm mounts into the padding-free
       * #term-inner below, or the computed row/col count overshoots the
       * actually-visible area. */
      #term-mount {
        flex: 1 1 auto;
        min-height: 0;
        background: #F7F3EB;
        padding: 14px;
        box-sizing: border-box;
      }
      #term-inner {
        width: 100%;
        height: 100%;
      }

      /* ---- Session picker mode ---- */
      #picker {
        display: none;
        order: 1;
        flex: 1 1 auto;
        min-height: 0;
        flex-direction: column;
        gap: 8px;
      }
      #app.picker-active #picker {
        display: flex;
      }
      #app.picker-active #session {
        display: none;
      }
      #picker-search {
        width: 100%;
        box-sizing: border-box;
        background: var(--surface-bg);
        border: 1px solid var(--surface-border);
        border-radius: var(--radius-md);
        color: var(--text-primary);
        font-family: inherit;
        font-size: 13px;
        padding: 8px 10px;
        outline: none;
        flex-shrink: 0;
      }
      #picker-list {
        flex: 1 1 auto;
        min-height: 0;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .picker-row {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 2px;
        width: 100%;
        box-sizing: border-box;
        text-align: left;
        background: transparent;
        border: none;
        border-radius: var(--radius-md);
        padding: 7px 8px;
        cursor: pointer;
        font-family: inherit;
      }
      .picker-row:hover {
        background: var(--surface-hover);
      }
      .picker-row-title {
        font-size: 13px;
        color: var(--text-primary);
      }
      .picker-row-meta {
        font-size: 11px;
        color: var(--text-secondary);
      }
      .note {
        font-size: 12px;
        font-style: italic;
        color: var(--text-secondary);
        padding: 0 12px;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="session">
        <div id="session-header"><span class="status-dot"></span>CLAUDE</div>
        <div id="term-mount"><div id="term-inner"></div></div>
      </div>
      <div id="picker">
        <input id="picker-search" type="text" placeholder="Search conversations…" />
        <div id="picker-list"></div>
      </div>
    </div>
    <script src="../shared/vendor/xterm/xterm.js"></script>
    <script src="../shared/vendor/xterm/addon-fit.js"></script>
    <script type="module" src="popup.js"></script>
  </body>
</html>
