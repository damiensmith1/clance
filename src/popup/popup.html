<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Clance</title>
    <link rel="stylesheet" href="../shared/theme.css" />
    <link rel="stylesheet" href="../shared/components.css" />
    <link rel="stylesheet" href="../shared/vendor/xterm/xterm.css" />
    <style>
      html, body {
        margin: 0;
        height: 100%;
        background: transparent;
        font-family: var(--font-sans);
        font-weight: var(--weight-regular);
        -webkit-font-smoothing: antialiased;
      }

      /* The window is user-resizable (drag its edges/corners); #app just
         fills whatever size the window is. One flat surface: the toolbar
         sits directly on the terminal's paper, no card inside a card. */
      #app {
        position: relative;
        display: flex;
        flex-direction: column;
        height: 100%;
        box-sizing: border-box;
        border-radius: var(--radius-xl);
        overflow: hidden;
        background: var(--app-bg);
        box-shadow: inset 0 0 0 1px var(--surface-border);
      }

      #session {
        order: 2;
        display: none;
        flex: 1 1 auto;
        min-height: 0;
        box-sizing: border-box;
        flex-direction: column;
      }
      #app.has-messages #session {
        display: flex;
      }

      /* The widget's only chrome, and its drag handle
         (-webkit-app-region: drag) since there's no native title bar
         (frame: false) — buttons inside it opt back out with no-drag. */
      #toolbar {
        order: 1;
        display: flex;
        align-items: center;
        gap: var(--space-2);
        height: 36px;
        padding: 0 var(--space-2) 0 14px;
        flex-shrink: 0;
        font-size: var(--text-md);
        color: var(--text-secondary);
        -webkit-app-region: drag;
      }
      #toolbar .status-dot {
        background: var(--success);
      }
      /* A live session is the one thing that gets the signal colour. */
      #app.has-messages #toolbar .status-dot {
        background: var(--signal);
        box-shadow: 0 0 0 3px var(--signal-soft);
      }
      .toolbar-label {
        flex-shrink: 0;
        font-family: var(--font-mono);
        font-size: var(--text-sm);
        color: var(--text-primary);
      }
      .toolbar-title {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-family: var(--font-mono);
        font-size: var(--text-sm);
        color: var(--text-tertiary);
      }
      .toolbar-title:empty {
        display: none;
      }
      .toolbar-spacer {
        flex: 1 1 auto;
      }
      .toolbar-btn {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 26px;
        height: 24px;
        padding: 0;
        background: transparent;
        border: none;
        border-radius: 5px;
        color: var(--text-secondary);
        cursor: pointer;
        -webkit-app-region: no-drag;
      }
      .toolbar-btn:hover {
        background: var(--surface-hover);
        color: var(--text-primary);
      }
      /* Only makes sense once there's a live session to move. */
      #open-in-app-btn {
        display: none;
      }
      #app.has-messages #open-in-app-btn {
        display: flex;
      }
      /* Same gating as #open-in-app-btn — hiding an empty/loading widget is
         indistinguishable from closing it, so only offer it once there's an
         actual conversation worth keeping alive. */
      #hide-btn {
        display: none;
      }
      #app.has-messages #hide-btn {
        display: flex;
      }

      /* "Open in…" opens an anchored menu: new session in a folder, then
         past conversations to resume. */
      #open-in-wrap {
        position: relative;
        min-width: 0;
        flex-shrink: 1;
        -webkit-app-region: no-drag;
      }
      .toolbar-title-btn {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        min-width: 0;
        max-width: 100%;
        height: 26px;
        margin-left: -6px;
        padding: 0 6px;
        border: none;
        border-radius: 5px;
        background: transparent;
        color: var(--text-tertiary);
        cursor: pointer;
      }
      .toolbar-title-btn:hover {
        background: var(--surface-hover);
      }
      .toolbar-title-btn svg {
        flex-shrink: 0;
      }
      .toolbar-text-btn {
        flex-shrink: 0;
        white-space: nowrap;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        height: 24px;
        padding: 0 var(--space-2);
        margin: 0;
        border: none;
        border-radius: 5px;
        background: transparent;
        font-family: var(--font-sans);
        font-size: var(--text-md);
        color: var(--text-secondary);
        cursor: pointer;
      }
      .toolbar-text-btn:hover {
        background: var(--surface-hover);
        color: var(--text-primary);
      }
      #open-in-dropdown {
        display: none;
        position: absolute;
        top: 100%;
        left: -6px;
        margin-top: var(--space-1);
        width: 380px;
        max-height: 340px;
        flex-direction: column;
        box-sizing: border-box;
        padding: var(--space-1);
        background: var(--surface-card);
        border-radius: 8px;
        box-shadow: var(--shadow-menu);
        text-align: left;
        color: var(--text-primary);
        cursor: default;
        z-index: 10;
      }
      #open-in-dropdown.open {
        display: flex;
      }
      #open-in-search {
        height: 30px;
        margin: var(--space-1) var(--space-1) 2px;
        box-sizing: border-box;
        padding: 0 var(--space-2);
        background: var(--surface-card);
        border: 1px solid var(--surface-border);
        border-radius: var(--radius-md);
        color: var(--text-primary);
        font-family: var(--font-sans);
        font-size: var(--text-md);
        outline: none;
        flex-shrink: 0;
      }
      #open-in-search:focus {
        border-color: var(--text-primary);
      }
      #open-in-list {
        flex: 1 1 auto;
        min-height: 0;
        max-height: 240px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
      }
      #open-in-new-section {
        display: flex;
        flex-direction: column;
        flex-shrink: 0;
      }
      #open-in-divider {
        height: 1px;
        background: var(--surface-border);
        margin: var(--space-1) 0;
        flex-shrink: 0;
      }
      /* Same shape as the shared .menu-item: title left, mono detail right. */
      .open-in-row {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
        min-height: 30px;
        box-sizing: border-box;
        padding: 0 10px;
        text-align: left;
        background: transparent;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        font-family: var(--font-sans);
      }
      .open-in-row:hover {
        background: var(--surface-bg);
      }
      .open-in-row-title {
        flex-shrink: 1;
        min-width: 0;
        font-size: var(--text-md);
        color: var(--text-primary);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .open-in-row-meta {
        flex: 1 0 auto;
        max-width: 55%;
        margin-left: auto;
        text-align: right;
        font-family: var(--font-mono);
        font-size: var(--text-xs);
        color: var(--text-tertiary);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      /* Hovering reveals what was captured and handed to the CLI at
         invocation. The card is positioned against #app (the link itself
         isn't positioned), so it always stays inside the window. It starts
         flush under the toolbar: a gap would be a dead zone that drops
         :hover on the way from the link to the card. */
      #context-link {
        flex-shrink: 0;
        display: inline-flex;
        align-items: center;
        height: 24px;
        padding: 0 var(--space-2);
        border-radius: 5px;
        font-family: var(--font-mono);
        font-size: var(--text-xs);
        color: var(--text-secondary);
        background: var(--surface-bg);
        cursor: default;
        -webkit-app-region: no-drag;
      }
      #context-link:hover {
        color: var(--accent-contrast);
        background: var(--accent);
      }
      #context-dialog {
        display: none;
        position: absolute;
        top: 32px;
        left: var(--space-3);
        right: var(--space-3);
        max-height: calc(100% - 48px);
        overflow-y: auto;
        box-sizing: border-box;
        padding: 14px;
        background: var(--surface-card);
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow-menu);
        text-align: left;
        font-family: var(--font-sans);
        font-size: var(--text-md);
        color: var(--text-primary);
        cursor: default;
        z-index: 10;
      }
      #context-link:hover #context-dialog {
        display: block;
      }
      /* One scrollbar for the whole card rather than nested scroll areas. */
      .context-dialog-label {
        margin: 14px 0 5px;
        font-family: var(--font-mono);
        font-size: var(--text-xs);
        text-transform: lowercase;
        color: var(--text-tertiary);
      }
      .context-dialog-label:first-child {
        margin-top: 0;
      }
      #context-dialog-image {
        width: 100%;
        display: block;
        border-radius: var(--radius-md);
        border: 1px solid var(--surface-border);
      }
      /* This ID selector's own `display: block` above outranks the browser
         default `[hidden] { display: none }` rule, so without this the
         broken-image icon rendered next to "No context was captured". */
      #context-dialog-image[hidden] {
        display: none;
      }
      #context-dialog-title {
        font-weight: var(--weight-medium);
        word-break: break-word;
      }
      #context-dialog-selection,
      #context-dialog-system-prompt {
        white-space: pre-wrap;
        word-break: break-word;
        padding: 10px;
        border-radius: var(--radius-md);
        background: var(--surface-bg);
        font-family: var(--font-mono);
        font-size: var(--text-sm);
        color: var(--text-primary);
      }
      #context-dialog-empty {
        color: var(--text-secondary);
      }

      /* FitAddon sizes rows/cols off the mount element's *direct parent*
       * clientHeight/Width without ever subtracting that parent's own
       * padding (a known xterm.js limitation) — so the padding lives here,
       * on the outer wrapper, while xterm mounts into the padding-free
       * #term-inner below, or the computed row/col count overshoots the
       * actually-visible area. */
      #term-mount {
        flex: 1 1 auto;
        min-height: 0;
        background: var(--app-bg);
        /* Little at the bottom: the terminal already leaves up to a row's
           height spare below its last line. */
        padding: var(--space-1) 14px var(--space-1);
        box-sizing: border-box;
      }
      #term-inner {
        width: 100%;
        height: 100%;
      }

      /* Shortcut reminders and the session's folder, under the terminal. */
      #hint-bar {
        display: flex;
        align-items: center;
        gap: 14px;
        height: 26px;
        flex-shrink: 0;
        padding: 0 14px;
        border-top: 1px solid var(--surface-border);
        font-family: var(--font-mono);
        font-size: var(--text-xs);
        color: var(--text-tertiary);
        white-space: nowrap;
        overflow: hidden;
      }
      .hint-bar-spacer {
        flex: 1;
      }
      #hint-bar-folder {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      /* Starting and error screens fill the terminal area. */
      .popup-state {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: var(--space-3);
        height: 100%;
        padding: 0 var(--space-7);
        box-sizing: border-box;
        text-align: center;
      }
      .popup-state-title {
        font-size: var(--text-lg);
        font-weight: var(--weight-medium);
        color: var(--text-primary);
      }
      .popup-state-text {
        font-size: var(--text-md);
        line-height: 1.6;
        color: var(--text-secondary);
      }
      .popup-state-actions {
        display: flex;
        gap: var(--space-2);
      }
      #app.has-error #toolbar .status-dot {
        background: var(--danger);
        box-shadow: none;
      }

      .note {
        padding: 0 var(--space-1);
        font-family: var(--font-mono);
        font-size: var(--text-sm);
        color: var(--text-tertiary);
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="toolbar">
        <span id="open-in-wrap">
          <button id="open-in-btn" class="toolbar-title-btn" title="Start or resume a session" aria-haspopup="menu">
            <span class="status-dot"></span><span class="toolbar-label" id="toolbar-label">claude</span><span class="toolbar-title" id="toolbar-title"></span>
            <svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M6 9l6 6 6-6" /></svg>
          </button>
          <div id="open-in-dropdown" role="menu">
            <div id="open-in-new-section">
              <div class="menu-label">new session in</div>
              <div id="open-in-recent-dirs"></div>
              <button id="open-in-browse-btn" class="open-in-row">
                <span class="open-in-row-title">Choose folder…</span>
                <span class="open-in-row-meta"></span>
              </button>
            </div>
            <div id="open-in-divider"></div>
            <div class="menu-label">resume</div>
            <input id="open-in-search" type="text" placeholder="Search sessions" aria-label="Search sessions" />
            <div id="open-in-list"></div>
          </div>
        </span>
        <div class="toolbar-spacer"></div>
        <span id="context-link" title="Captured context">
          ctx
          <div id="context-dialog">
            <div class="context-dialog-label">captured when you opened clance</div>
            <div id="context-dialog-window-label" class="context-dialog-label" hidden>window</div>
            <div id="context-dialog-title" hidden></div>
            <div id="context-dialog-image-label" class="context-dialog-label" hidden>screenshot</div>
            <img id="context-dialog-image" hidden alt="Screenshot at invocation" />
            <div id="context-dialog-selection-label" class="context-dialog-label" hidden>selection</div>
            <div id="context-dialog-selection" hidden></div>
            <div id="context-dialog-system-prompt-label" class="context-dialog-label" hidden>system prompt</div>
            <div id="context-dialog-system-prompt" hidden></div>
            <div id="context-dialog-empty" hidden>No context was captured for this session.</div>
          </div>
        </span>
        <button id="open-in-app-btn" class="toolbar-btn" title="Open in Clance window" aria-label="Open in Clance window">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 13v6a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h6" />
            <path d="M20 4L10 14M10 8v6h6" />
          </svg>
        </button>
        <button id="hide-btn" class="toolbar-btn" title="Hide (⌥Space to reopen)" aria-label="Hide">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 12h14" />
          </svg>
        </button>
        <button id="close-btn" class="toolbar-btn" title="Close" aria-label="Close">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 6l12 12M18 6L6 18" />
          </svg>
        </button>
      </div>
      <div id="session">
        <div id="term-mount"><div id="term-inner"></div></div>
        <div id="hint-bar">
          <span id="hint-bar-toggle">⌥Space hide</span><span>⌘⇧R add screen</span><span class="hint-bar-spacer"></span><span id="hint-bar-folder"></span>
        </div>
      </div>
    </div>
    <script src="../shared/vendor/xterm/xterm.js"></script>
    <script src="../shared/vendor/xterm/addon-fit.js"></script>
    <script type="module" src="popup.js"></script>
  </body>
</html>
