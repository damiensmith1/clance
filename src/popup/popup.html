<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Clance</title>
    <link rel="stylesheet" href="../shared/theme.css" />
    <style>
      html, body {
        margin: 0;
        background: transparent;
        font-family: var(--font-sans);
        -webkit-font-smoothing: antialiased;
      }

      #app {
        position: relative;
        display: flex;
        flex-direction: column;
        max-height: 480px;
        box-sizing: border-box;
        padding: 14px;
        border-radius: var(--radius-lg);
        overflow: hidden;
        background: var(--surface-card);
        border: 1px solid var(--surface-border);
        box-shadow: 0 8px 30px rgba(51, 44, 34, 0.16);
        gap: 10px;
      }

      #session {
        order: 1;
        display: none;
        flex: 1 1 auto;
        min-height: 0;
        flex-direction: column;
        border: 1px solid var(--surface-border);
        border-radius: var(--radius-md);
        overflow: hidden;
      }
      #app.has-messages #session {
        display: flex;
      }

      #session-header {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 8px 12px;
        font-size: 10.5px;
        font-weight: 700;
        letter-spacing: 0.06em;
        color: var(--text-secondary);
        border-bottom: 1px solid var(--surface-border);
        flex-shrink: 0;
      }
      .status-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--success);
        flex-shrink: 0;
      }

      #transcript {
        flex: 1 1 auto;
        min-height: 0;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 14px;
        padding: 12px;
      }
      #transcript::-webkit-scrollbar {
        width: 5px;
      }
      #transcript::-webkit-scrollbar-thumb {
        background: var(--surface-active);
        border-radius: 3px;
      }

      #input-box {
        order: 2;
        flex-shrink: 0;
        border: 1px solid var(--surface-border);
        border-radius: var(--radius-md);
        padding: 10px 12px 8px;
      }

      #goal {
        width: 100%;
        box-sizing: border-box;
        background: transparent;
        border: none;
        color: var(--text-primary);
        font-family: inherit;
        font-size: 14px;
        outline: none;
      }
      #goal::placeholder {
        color: var(--text-secondary);
      }
      #goal:disabled {
        opacity: 0.5;
      }

      #input-actions {
        display: flex;
        gap: 10px;
        margin-top: 6px;
        color: var(--text-secondary);
      }
      #input-actions span {
        display: flex;
      }

      #footer-hint {
        order: 3;
        flex-shrink: 0;
        text-align: center;
        font-size: 11px;
        color: var(--text-secondary);
      }
      #footer-hint .kbd {
        display: inline-block;
        border: 1px solid var(--surface-border);
        border-radius: 4px;
        padding: 0 4px;
        font-family: var(--font-mono);
        font-size: 10px;
      }

      .turn {
        display: flex;
        gap: 8px;
        animation: turn-in 0.15s ease;
      }
      @keyframes turn-in {
        from { opacity: 0; transform: translateY(4px); }
        to { opacity: 1; transform: translateY(0); }
      }

      .avatar {
        flex-shrink: 0;
        width: 22px;
        height: 22px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .avatar-user {
        background: var(--surface-bg);
        color: var(--text-secondary);
      }
      .avatar-assistant {
        background: var(--accent);
        color: var(--accent-contrast);
      }

      .turn-body {
        min-width: 0;
        flex: 1 1 auto;
      }

      .turn-prompt {
        display: inline-block;
        background: var(--surface-bg);
        border-radius: var(--radius-md);
        padding: 6px 10px;
        font-size: 13px;
        color: var(--text-primary);
      }

      .turn-reply {
        font-size: 13.5px;
        line-height: 1.5;
        color: var(--text-primary);
        overflow-wrap: anywhere;
      }
      .turn-reply p {
        margin: 0 0 8px;
      }
      .turn-reply p:last-child {
        margin-bottom: 0;
      }
      .turn-reply h1,
      .turn-reply h2,
      .turn-reply h3 {
        margin: 12px 0 6px;
        font-weight: 600;
        color: var(--text-primary);
      }
      .turn-reply h1 { font-size: 15px; }
      .turn-reply h2 { font-size: 14px; }
      .turn-reply h3 { font-size: 13.5px; }
      .turn-reply ul,
      .turn-reply ol {
        margin: 0 0 8px;
        padding-left: 20px;
      }
      .turn-reply li {
        margin-bottom: 2px;
      }
      .turn-reply strong {
        font-weight: 600;
        color: var(--text-primary);
      }
      .turn-reply code {
        font-family: var(--font-mono);
        font-size: 12px;
        background: var(--surface-hover);
        border-radius: 4px;
        padding: 1px 5px;
      }

      .code-block {
        margin: 8px 0;
        border-radius: var(--radius-md);
        overflow: hidden;
        background: #2b2620;
      }
      .code-block-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 5px 10px;
        font-family: var(--font-mono);
        font-size: 11px;
        color: rgba(251, 249, 243, 0.55);
        background: rgba(255, 255, 255, 0.04);
      }
      .code-copy-btn {
        background: none;
        border: none;
        color: inherit;
        font-family: inherit;
        font-size: 11px;
        cursor: pointer;
        padding: 0;
      }
      .code-copy-btn:hover {
        color: rgba(251, 249, 243, 0.9);
      }
      .code-block pre {
        margin: 0;
        padding: 10px 12px;
        overflow-x: auto;
      }
      .code-block code {
        font-family: var(--font-mono);
        font-size: 12px;
        line-height: 1.5;
        white-space: pre;
        color: #f2ede2;
      }
      .tok-keyword { color: #c99bdb; }
      .tok-string { color: #9fca8f; }
      .tok-comment { color: #8c8270; font-style: italic; }
      .tok-number { color: #7fb3d5; }

      .note {
        font-size: 12px;
        font-style: italic;
        color: var(--text-secondary);
        padding: 0 12px;
      }

      .typing {
        display: inline-flex;
        gap: 4px;
        padding: 2px 0;
      }
      .typing span {
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: var(--text-secondary);
        animation: typing-blink 1.2s infinite ease-in-out;
      }
      .typing span:nth-child(2) { animation-delay: 0.2s; }
      .typing span:nth-child(3) { animation-delay: 0.4s; }
      @keyframes typing-blink {
        0%, 80%, 100% { opacity: 0.25; }
        40% { opacity: 1; }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="session">
        <div id="session-header"><span class="status-dot"></span>ACTIVE SESSION</div>
        <div id="transcript"></div>
      </div>
      <div id="input-box">
        <input id="goal" type="text" placeholder="Message Clance…" autofocus />
        <div id="input-actions">
          <span title="Attach (coming soon)">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16.5 6.5l-7 7a3 3 0 0 0 4.2 4.2l7-7a5 5 0 0 0-7.1-7.1l-7 7a7 7 0 0 0 9.9 9.9"/></svg>
          </span>
          <span title="Quick actions (coming soon)">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.4 4.6L18 9l-4.6 1.4L12 15l-1.4-4.6L6 9l4.6-1.4L12 3z"/></svg>
          </span>
        </div>
      </div>
      <div id="footer-hint">Hit <span class="kbd">Esc</span> to dismiss</div>
    </div>
    <script type="module" src="popup.js"></script>
  </body>
</html>
